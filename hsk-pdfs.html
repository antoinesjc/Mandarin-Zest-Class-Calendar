<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All the new HSK vocab lists · Mandarin Zest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* "Download all the new HSK vocab lists": email + consent → saved in the Start Here sheet
     (source "hsk-vocab-pdfs | <level>") → the download buttons appear.
     PDFs: list at the bottom of the file (ALL_URL = one file with everything, optional). Embed height: see README. */
  :root { --ink:#2a2420; --muted:#5c4f47; --orange:#f37a48; --orange-d:#e2632f; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; }
  body { font-family:'Outfit',system-ui,sans-serif; color:var(--ink); -webkit-font-smoothing:antialiased; padding:6px; }
  .card { max-width:1000px; margin:0 auto; background:#f8dacd; border-radius:26px; padding:34px 38px; display:grid; grid-template-columns:260px minmax(0,1fr); gap:38px; align-items:center; overflow:hidden; }

  /* fanned stack of list covers */
  .stack { position:relative; height:250px; }
  .pg { position:absolute; left:50%; bottom:6px; width:132px; height:186px; margin-left:-66px; border-radius:10px; background:#fff; box-shadow:0 10px 22px rgba(42,36,32,.16);
        transform-origin:50% 120%; transform:rotate(var(--r)) translateY(0); transition:transform .5s cubic-bezier(.2,.8,.2,1); padding:14px 12px; display:flex; flex-direction:column; gap:7px; }
  .card:hover .pg { transform:rotate(calc(var(--r) * 1.25)) translateY(-6px); }
  .pg .tag { align-self:flex-start; font-size:12px; font-weight:800; padding:3px 8px; border-radius:6px; background:var(--c); color:#fff; }
  .pg .ln { height:6px; border-radius:3px; background:#efe2d9; }
  .pg .ln.s { width:60%; } .pg .ln.m { width:82%; }
  .pg .zh { font-size:22px; font-weight:800; color:var(--c); margin-top:auto; letter-spacing:.04em; }
  .count { position:absolute; right:4px; top:4px; background:var(--ink); color:#fff; font-weight:800; font-size:13px; border-radius:999px; padding:7px 12px; transform:rotate(6deg); z-index:20; }

  .eyebrow { font-size:12.5px; font-weight:800; letter-spacing:.09em; color:#a8431a; }
  h2 { margin:6px 0 8px; font-size:28px; font-weight:800; line-height:1.15; }
  p.sub { margin:0 0 16px; font-size:15.5px; line-height:1.5; color:#4a3c34; }
  .levels { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 12px; border:0; padding:0; }
  .levels legend { font-size:13px; font-weight:700; color:var(--muted); margin-bottom:6px; padding:0; }
  .levels label { cursor:pointer; }
  .levels input { position:absolute; opacity:0; pointer-events:none; }
  .levels span { display:inline-block; font-size:13px; font-weight:700; padding:6px 11px; border-radius:999px; background:rgba(255,255,255,.6); }
  .levels input:checked + span { background:var(--ink); color:#fff; }
  .levels input:focus-visible + span { outline:3px solid var(--orange-d); outline-offset:2px; }
  .f { display:flex; gap:10px; }
  .f input[type=email] { flex:1; min-width:0; height:50px; border:2px solid transparent; border-radius:999px; padding:0 20px; font:inherit; font-size:16px; background:#fff; color:var(--ink); }
  .f input[type=email]:focus { outline:none; border-color:var(--orange-d); }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; height:50px; padding:0 24px; border:0; border-radius:999px; background:var(--orange); color:var(--ink);
         font:inherit; font-weight:800; font-size:16px; cursor:pointer; text-decoration:none; white-space:nowrap; transition:background .2s, transform .2s; }
  .btn:hover { background:var(--orange-d); transform:translateY(-1px); }
  .btn.dark { background:var(--ink); color:#fff; } .btn.dark:hover { background:#000; }
  .consent { display:flex; gap:8px; align-items:flex-start; font-size:13px; line-height:1.4; color:#4a3c34; margin-top:10px; cursor:pointer; }
  .consent input { width:17px; height:17px; margin:1px 0 0; flex:none; accent-color:var(--orange-d); }
  .err { color:#a3261a; font-size:13px; font-weight:700; min-height:18px; margin-top:6px; }
  .trap { position:absolute; left:-5000px; }

  .done[hidden], form[hidden] { display:none; }
  .done h2 { font-size:24px; }
  .files { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin:12px 0 0; }
  .file { display:flex; align-items:center; gap:8px; background:#fff; border-radius:12px; padding:10px 12px; text-decoration:none; color:var(--ink); font-weight:700; font-size:14px; transition:transform .2s, box-shadow .2s; }
  .file:hover { transform:translateY(-1px); box-shadow:0 6px 14px rgba(42,36,32,.1); }
  .file i { font-style:normal; font-size:11px; font-weight:800; color:#fff; background:var(--c); border-radius:5px; padding:3px 6px; }
  .file em { margin-left:auto; font-style:normal; color:var(--muted); }

  @media (max-width:900px) {
    body { padding:2px; }
    .card { grid-template-columns:1fr; gap:6px; padding:20px 18px 22px; border-radius:20px; }
    .stack { height:132px; }
    .pg { width:78px; height:108px; margin-left:-39px; padding:8px 7px; gap:4px; border-radius:7px; }
    .pg .tag { font-size:9px; padding:2px 5px; } .pg .ln { height:4px; } .pg .zh { font-size:13px; }
    .count { font-size:11px; padding:5px 9px; right:12%; }
    h2 { font-size:21px; } p.sub { font-size:14px; margin-bottom:12px; }
    .f { flex-direction:column; } .f input[type=email], .btn { height:46px; }
    .levels span { font-size:12px; padding:5px 9px; }
    .files { grid-template-columns:1fr 1fr; }
  }
  @media (prefers-reduced-motion:reduce) { .pg { transition:none; } }
</style>
</head>
<body>
<section class="card" aria-labelledby="ttl">
  <div class="stack" id="stack" aria-hidden="true"><span class="count" id="count"></span></div>
  <div>
    <form id="form" novalidate>
      <div class="eyebrow">FREE DOWNLOAD</div>
      <h2 id="ttl">Get all the new HSK vocab lists at once</h2>
      <p class="sub">Every list from HSK 1 to HSK 7–9 as printable PDFs. Download them right away, and get our best study tips by email.</p>
      <fieldset class="levels" id="levels"><legend>I'm studying for (optional)</legend></fieldset>
      <div class="f">
        <input type="email" id="email" placeholder="Your email" autocomplete="email" aria-label="Your email" required>
        <button class="btn" type="submit" id="go">Get the PDFs ↓</button>
      </div>
      <label class="consent"><input type="checkbox" id="ok">I agree to receive emails from Mandarin Zest. I can unsubscribe at any time.</label>
      <input class="trap" type="text" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="err" id="err" role="alert"></div>
    </form>
    <div class="done" id="done" hidden aria-live="polite">
      <div class="eyebrow">YOU'RE IN 🎉</div>
      <h2>Here are your HSK vocab lists</h2>
      <div id="all"></div>
      <div class="files" id="files"></div>
    </div>
  </div>
</section>
<script>
  // ═══ PDFS: one per list. Put the PDF files in the downloads/hsk/ folder of the repo (or any public link) ═══
  // Until the PDFs are added, each button opens that level's page on the website.
  var PDFS = [
    { name:"HSK 1",   c:"#4f9a4f", url:"downloads/hsk/New-HSK-1-Vocab-List-Mandarin-Zest.pdf" },
    { name:"HSK 2",   c:"#4f9a4f", url:"downloads/hsk/New-HSK-2-Vocab-List-Mandarin-Zest.pdf" },
    { name:"HSK 3",   c:"#4f9a4f", url:"downloads/hsk/New-HSK-3-Vocab-List-Mandarin-Zest.pdf" },
    { name:"HSK 4",   c:"#e0835f", url:"downloads/hsk/New-HSK-4-Vocab-List-Mandarin-Zest.pdf" },
    { name:"HSK 5",   c:"#e0835f", url:"downloads/hsk/New-HSK-5-Vocab-List-Mandarin-Zest.pdf" },
    { name:"HSK 6",   c:"#e0835f", url:"https://www.mandarinzest.com/blog/free-resources-2/new-hsk-6-vocab-list-17" },
    { name:"HSK 7–9", c:"#d5602f", url:"https://www.mandarinzest.com/blog/free-resources-2/new-hsk-7-9-vocab-list-18" }
  ];
  var ALL_URL = "";   // e.g. "downloads/hsk/new-hsk-all-levels.zip" → shows one big "Download everything" button
  var SHEET_URL = "https://script.google.com/macros/s/AKfycbwPWbx4dg8r7HWMa_uMV-2ZH6Xis7VnzEWvUgVc8G3AUzY4lnrtaooCZGgsDrwHZ9VMYg/exec"; // Start Here sheet

  var ZH = ["一级", "二级", "三级", "四级", "五级", "六级", "高等"];
  var stack = document.getElementById("stack"), n = PDFS.length;
  PDFS.forEach(function (p, i) {
    var d = document.createElement("div"); d.className = "pg";
    d.style.cssText = "--c:" + p.c + ";--r:" + ((i - (n - 1) / 2) * 7) + "deg;z-index:" + (i + 1);
    d.innerHTML = '<span class="tag">' + p.name + '</span><span class="ln"></span><span class="ln m"></span><span class="ln s"></span><span class="ln m"></span><span class="zh">' + (ZH[i] || "") + '</span>';
    stack.appendChild(d);
  });
  document.getElementById("count").textContent = n + " lists · PDF";
  document.getElementById("levels").insertAdjacentHTML("beforeend",
    PDFS.map(function (p) { return '<label><input type="radio" name="lvl" value="' + p.name + '"><span>' + p.name + '</span></label>'; }).join("") +
    '<label><input type="radio" name="lvl" value="not sure"><span>Not sure</span></label>');

  var KEY = "mz-hsk-pdfs";
  function unlocked() { try { return localStorage.getItem(KEY) === "1"; } catch (e) { return false; } }
  function reveal() {
    document.getElementById("form").hidden = true;
    document.getElementById("done").hidden = false;
    document.getElementById("all").innerHTML = ALL_URL ? '<a class="btn dark" href="' + ALL_URL + '" download target="_blank" rel="noopener">Download everything (' + n + ' lists) ↓</a>' : "";
    document.getElementById("files").innerHTML = PDFS.map(function (p) {
      var isPdf = /\.pdf($|\?)/i.test(p.url);
      return '<a class="file" style="--c:' + p.c + '" href="' + p.url + '" target="_blank" rel="noopener"' + (isPdf ? " download" : "") + '><i>PDF</i>' + p.name + '<em>' + (isPdf ? "↓" : "↗") + '</em></a>';
    }).join("");
  }
  if (unlocked()) reveal();

  // Google Analytics: tell the Odoo page what happened (no personal data). The page's <head> listener sends it to GA.
  function mzGA(name, params) { try { (window.opener || window.top).postMessage({ mz: "track", ga: { event: name, params: params || {} } }, "*"); } catch (e) {} }
  document.getElementById("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var email = document.getElementById("email").value.trim(), err = document.getElementById("err");
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { err.textContent = "Please enter a valid email."; return; }
    if (!document.getElementById("ok").checked) { err.textContent = "Please tick the box to get the PDFs."; return; }
    err.textContent = "";
    if (!document.getElementById("website").value) {
      var lvl = (document.querySelector('input[name="lvl"]:checked') || {}).value || "no level";
      fetch(SHEET_URL, { method:"POST", mode:"no-cors", keepalive:true, headers:{ "Content-Type":"text/plain;charset=utf-8" },
        body: JSON.stringify({ email: email, source: "hsk-vocab-pdfs | " + lvl, timestamp: new Date().toISOString() }) }).catch(function () {});
    }
    mzGA("generate_lead", { lead_source: "hsk-vocab-pdfs", hsk_level: (document.querySelector('input[name="lvl"]:checked') || {}).value || "no level" });
    try { localStorage.setItem(KEY, "1"); } catch (e2) {}
    reveal();
  });
</script>
</body>
</html>

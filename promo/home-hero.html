<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mandarin Zest: mascot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Noto+Sans+SC:wght@700&display=swap" rel="stylesheet">
<style>
  /* A 360x400 scene that scales to fit any frame. Transparent background:
     it takes the colour of the section it sits in. */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: 'Outfit', system-ui, sans-serif; color: #2a2420; display: flex; align-items: center; justify-content: center; }

  .stage { position: relative; width: 360px; height: 400px; flex: none; transform-origin: center center; }
  .tilt { position: absolute; inset: 0; transition: transform .25s ease-out; }

  /* soft blob behind the mascot */
  .blob { position: absolute; left: 30px; top: 110px; width: 300px; height: 250px; border-radius: 48% 52% 45% 55% / 55% 45% 55% 45%; background: #f8dacd; animation: morph 12s ease-in-out infinite; }
  @keyframes morph { 0%,100% { border-radius: 48% 52% 45% 55% / 55% 45% 55% 45%; } 50% { border-radius: 55% 45% 52% 48% / 45% 55% 45% 55%; } }

  /* mascot */
  .mascot {
    position: absolute; left: 66px; bottom: 40px; width: 220px; z-index: 20; cursor: pointer;
    background: none; border: 0; padding: 0; animation: bob 3.2s ease-in-out infinite; transform-origin: bottom center;
    -webkit-tap-highlight-color: transparent;
  }
  .mascot img { width: 100%; display: block; pointer-events: none; }
  .mascot:focus-visible { outline: 3px solid #4f7a94; outline-offset: 4px; border-radius: 20px; }
  .mascot:hover { filter: drop-shadow(0 6px 10px rgba(42,36,32,.15)); }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-8px) rotate(2deg); } }
  .mascot.boing { animation: boing .5s cubic-bezier(.3,1.6,.5,1); }
  @keyframes boing { 0% { transform: scale(1); } 30% { transform: scale(1.12, .9); } 60% { transform: scale(.95, 1.06); } 100% { transform: scale(1); } }

  /* speech bubble */
  .bubble {
    position: absolute; left: 176px; bottom: 262px; z-index: 21; min-width: 140px;
    background: #fff; border-radius: 20px 20px 20px 4px; padding: 11px 16px 10px;
    box-shadow: 0 10px 22px rgba(42,36,32,.16); text-align: center;
    transform-origin: bottom left; transition: transform .25s cubic-bezier(.3,1.6,.5,1), opacity .2s;
  }
  .bubble.swap { transform: scale(.6); opacity: 0; }
  .zh { display: block; font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 30px; font-weight: 700; line-height: 1.1; color: #2a2420; }
  .py { display: block; font-size: 14px; font-weight: 700; color: #c4521f; margin-top: 3px; }
  .en { display: block; font-size: 13px; color: #6b5a50; margin-top: 1px; }

  /* "tap me!" hint */
  .hint {
    position: absolute; left: 0; right: 0; bottom: 6px; margin: 0 auto; width: max-content; z-index: 22;
    font-size: 14px; font-weight: 800; color: #a8431a;
    background: #fff; padding: 6px 14px; border-radius: 999px; box-shadow: 0 6px 14px rgba(42,36,32,.12);
    transition: opacity .4s; animation: nudge 1.6s ease-in-out infinite; pointer-events: none;
  }
  .hint::before { content: ""; position: absolute; left: 50%; top: -6px; margin-left: -6px; border: 6px solid transparent; border-top: 0; border-bottom-color: #fff; }
  @keyframes nudge { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .hint.gone { opacity: 0; }


  /* hearts that pop out on tap */
  .pop { position: absolute; z-index: 23; font-size: 20px; pointer-events: none; animation: pop .9s ease-out forwards; }
  @keyframes pop { 0% { opacity: 0; transform: translate(0,0) scale(.4); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx), -70px) scale(1.1); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="tilt" id="tilt">
    <div class="blob" aria-hidden="true"></div>

    <div class="bubble" id="bubble" aria-live="polite">
      <span class="zh" id="zh">你好！</span><span class="py" id="py">nǐ hǎo</span><span class="en" id="en">Hello!</span>
    </div>
    <button class="mascot" id="mascot" type="button" aria-label="Tap the mascot to hear another phrase">
      <img src="mascot-laptop.png" alt="">
    </button>
    <span class="hint" id="hint" aria-hidden="true">tap me!</span>
  </div>
</div>

<script>
  // Phrases written the same way in simplified and traditional characters.
  var PHRASES = [
    ["你好！", "nǐ hǎo", "Hello!"],
    ["加油！", "jiāyóu", "You've got this!"],
    ["太好了！", "tài hǎo le", "Awesome!"],
    ["好吃！", "hǎochī", "Delicious!"],
    ["你好棒！", "nǐ hǎo bàng", "You're amazing!"],
    ["没问题！", "méi wèntí", "No problem!"]
  ];
  // 没 is simplified; swap to 沒 for traditional if you prefer.

  var stage = document.getElementById("stage"), tilt = document.getElementById("tilt");
  var bubble = document.getElementById("bubble"), mascot = document.getElementById("mascot"), hint = document.getElementById("hint");
  var i = 0, timer, taps = 0;
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Scale the scene to fit the frame.
  function fit() {
    var s = Math.min(window.innerWidth / 360, window.innerHeight / 400);
    stage.style.transform = "scale(" + Math.max(0.3, s) + ")";
  }
  window.addEventListener("resize", fit); fit();

  function say(next) {
    i = next % PHRASES.length;
    bubble.classList.add("swap");
    setTimeout(function () {
      document.getElementById("zh").textContent = PHRASES[i][0];
      document.getElementById("py").textContent = PHRASES[i][1];
      document.getElementById("en").textContent = PHRASES[i][2];
      bubble.classList.remove("swap");
    }, 180);
  }
  function auto() { clearInterval(timer); if (!reduce) timer = setInterval(function () { say(i + 1); }, 3200); }
  auto();

  function hearts() {
    if (reduce) return;
    var icons = ["❤", "✨", "🍊"];
    for (var k = 0; k < 3; k++) {
      var h = document.createElement("span");
      h.className = "pop"; h.setAttribute("aria-hidden", "true");
      h.textContent = icons[(taps + k) % icons.length];
      h.style.left = (150 + k * 26) + "px"; h.style.top = "150px";
      h.style.setProperty("--dx", ((k - 1) * 28) + "px");
      h.style.animationDelay = (k * 0.08) + "s";
      tilt.appendChild(h);
      setTimeout(function (el) { el.remove(); }, 1200, h);
    }
  }

  mascot.addEventListener("click", function () {
    taps++;
    say(i + 1); auto();
    hint.classList.add("gone");
    hearts();
    mascot.classList.remove("boing"); void mascot.offsetWidth; mascot.classList.add("boing");
    setTimeout(function () { mascot.classList.remove("boing"); }, 520);
  });

  // Gentle 3D tilt following the mouse (desktop only).
  if (!reduce && window.matchMedia("(hover: hover)").matches) {
    document.addEventListener("mousemove", function (e) {
      var x = e.clientX / window.innerWidth - 0.5, y = e.clientY / window.innerHeight - 0.5;
      tilt.style.transform = "perspective(900px) rotateY(" + (x * 8) + "deg) rotateX(" + (-y * 6) + "deg)";
    });
    document.addEventListener("mouseleave", function () { tilt.style.transform = ""; });
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mandarin Zest Club trial sessions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Noto+Serif+SC:wght@600&display=swap" rel="stylesheet">
<style>
  /* Shows the upcoming sessions with #trial in their Google Calendar description.
     Shows every upcoming trial session (up to 8). Two fit side by side; when there
     are more, visitors swipe or use the arrows. Optional: ?count=2 to limit. Use a 340px frame. */
  :root {
    --ink: #2a2420;
    --muted: #5c4f47;
    --green: #1b6f1b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }
  body { font-family: 'Outfit', 'Noto Serif SC', system-ui, sans-serif; color: var(--ink); padding: 16px 16px 8px; }
  .shell { position: relative; max-width: 1060px; margin: 0 auto; }
  .shell.has-more { padding: 0 30px; }
  .cards {
    display: flex; gap: 24px; overflow-x: auto; scroll-snap-type: x mandatory;
    padding: 4px 4px 14px; scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .cards::-webkit-scrollbar { display: none; }
  .card { flex: 0 0 calc((100% - 24px) / 2); min-width: 280px; scroll-snap-align: start; }
  .card:first-child { margin-left: auto; } .card:last-child { margin-right: auto; }
  .arrow {
    position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; border: 0;
    background: #fff; box-shadow: 0 6px 18px rgba(42,36,32,.18); font-size: 22px; cursor: pointer; display: none; z-index: 2; font-family: inherit; color: var(--ink);
  }
  .arrow.l { left: -6px; } .arrow.r { right: -6px; }
  .has-more .arrow { display: block; }
  .dots { display: none; justify-content: center; gap: 6px; }
  .has-more .dots { display: flex; }
  .dots i { width: 6px; height: 6px; border-radius: 3px; background: #e3d3c9; transition: width .2s, background .2s; }
  .dots i.on { background: #1b6f1b; width: 16px; }
  .card {
    background: #ffffff;
    border-radius: 20px;
    border-top: 6px solid var(--cat, #6b6559);
    padding: 26px 28px;
    box-shadow: 0 1px 0 #efe2d9, 0 8px 24px rgba(42, 36, 32, 0.06);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .lvl { font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: #f1ece8; color: var(--muted); }
  .seats { font-size: 13px; font-weight: 700; color: #a8431a; }
  h3 { margin: 0; font-size: 23px; font-weight: 800; line-height: 1.2; }
  .when { display: flex; flex-direction: column; gap: 3px; font-size: 16px; }
  .when span { color: var(--muted); font-size: 15px; }
  .topic { margin: 0; font-size: 15px; line-height: 1.5; color: var(--muted); }
  .bottom { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: auto; padding-top: 6px; flex-wrap: wrap; }
  .price { font-size: 28px; font-weight: 800; }
  .btn {
    background: var(--green);
    color: #ffffff;
    text-decoration: none;
    font-weight: 700;
    font-size: 16px;
    padding: 13px 26px;
    border-radius: 999px;
  }
  .btn:hover { background: #145514; }
  .btn:focus-visible { outline: 3px solid #4f7a94; outline-offset: 3px; }
  .soon { font-size: 15px; font-weight: 600; color: var(--muted); }
  .btn.out { background: #e9e2dc; color: #8a7d74; pointer-events: none; }
  .seats.few { color: #c4521f; }
  .seats.full { color: #8a7d74; }
  /* email step: label, then the email box, then Continue, always stacked full width */
  .ask { display: flex; flex-direction: column; align-items: stretch; gap: 8px; width: 100%; }
  .asklbl { font-size: 14px; font-weight: 700; color: var(--ink); }
  .ask input { width: 100%; min-width: 0; font: inherit; font-size: 16px; padding: 12px 16px; border: 1.5px solid #cdb9ac; border-radius: 999px; background: #fffaf6; color: var(--ink); }
  .ask input::placeholder { color: #8a7d74; }
  .ask .btn { width: 100%; flex: none; text-align: center; }
  .ask input:focus { outline: none; border-color: #f37a48; }
  .ask .btn { border: 0; cursor: pointer; font-family: inherit; }
  .askmsg { font-size: 13.5px; color: var(--muted); line-height: 1.4; min-height: 0; }
  .askmsg.warn { color: #a8431a; font-weight: 600; }
  .askmsg a { color: #1b6f1b; font-weight: 700; }
  .empty {
    max-width: 640px;
    margin: 0 auto;
    text-align: center;
    background: #ffffff;
    border-radius: 20px;
    padding: 32px 24px;
    font-size: 17px;
    line-height: 1.5;
    color: var(--muted);
  }
  .empty strong { display: block; color: var(--ink); font-size: 20px; margin-bottom: 6px; }
  @media (max-width: 760px) {
    body { padding: 10px 0 4px; }
    .shell.has-more { padding: 0; }
    .cards { gap: 14px; padding: 4px 16px 10px; scroll-padding-left: 16px; }
    .card { flex-basis: 86%; max-width: 420px; min-width: 0; padding: 18px 20px; gap: 9px; }
    .arrow { display: none !important; }
    h3 { font-size: 20px; } .when { font-size: 15px; } .when span { font-size: 13.5px; }
    .bottom { flex-wrap: nowrap; gap: 10px; padding-top: 2px; }
    .price { font-size: 23px; } .btn { padding: 11px 18px; font-size: 15px; white-space: nowrap; }
  }
  @media (max-width: 440px) {
    /* narrow phones: button under the price, full width, so it never gets cut off */
    .bottom { flex-wrap: wrap; }
    .bottom .btn { flex: 1 1 100%; text-align: center; }
  }

  /* "one trial per person" pop-up (placed next to the form, works inside a full-height frame) */
  .once-bg { position: absolute; left: 0; top: 0; width: 100%; background: rgba(42,36,32,.32); z-index: 50; animation: oncefade .15s ease-out; }
  .once { position: absolute; z-index: 51; width: min(360px, calc(100% - 24px)); background: #fffaf6; border-radius: 20px; padding: 22px 20px 18px; box-shadow: 0 18px 50px rgba(42,36,32,.28); text-align: center; font-family: 'Outfit', system-ui, sans-serif; color: #2a2420; animation: oncein .18s ease-out; }
  .once .em { font-size: 34px; line-height: 1; }
  .once h4 { margin: 8px 0 6px; font-size: 19px; font-weight: 800; }
  .once p { margin: 0 0 14px; font-size: 14.5px; line-height: 1.5; color: #5c4f47; }
  .once a.go { display: block; background: #1b6f1b; color: #fff; font-weight: 800; font-size: 15px; padding: 12px; border-radius: 999px; text-decoration: none; }
  .once a.go:hover { background: #173f17; color: #fff; }
  .once button { margin-top: 8px; border: 0; background: none; font: inherit; font-size: 14px; color: #8a7d74; cursor: pointer; padding: 6px 10px; }
  .once .x { position: absolute; top: 8px; right: 8px; margin: 0; font-size: 20px; width: 32px; height: 32px; padding: 0; }
  @keyframes oncefade { from { opacity: 0; } }
  @keyframes oncein { from { opacity: 0; transform: translateY(8px) scale(.97); } }
</style>
</head>
<body>
<div id="root" aria-live="polite"></div>

<script>
// Price and booking link for every trial session. Change them here.
const PRICE = "US$2.50";
const BOOK_URL = "https://buy.stripe.com/cNi6oH94B8Dj6DCf0x6oo0k";
// Seats: the trial-bookings Apps Script tells how many of the 6 trial seats are taken (leave empty to hide).
const SEATS_URL = "https://script.google.com/macros/s/AKfycbyUmZxGz3BZIeQQcp3SbFPtnFCv0FgFebbct-3UBsmhzgp9gVZbN7zuGDA18QcPhfK0/exec";
const MAX_SEATS = 6;
let TAKEN = {};

const CAT_COLORS = {
  advanced: "#3f6d5e", intermediate: "#4f7a94", beginner: "#b98a3d",
  native: "#a63d2f", character: "#7d5a8c", general: "#6b6559",
};

const params = new URLSearchParams(location.search);
const COUNT = Math.min(8, Math.max(1, parseInt(params.get("count"), 10) || 8));
const root = document.getElementById("root");

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function reportHeight() {
  const h = Math.ceil(root.getBoundingClientRect().bottom + 24);
  try { parent.postMessage({ mzTrialHeight: h }, "*"); } catch (e) {}
}
window.addEventListener("resize", reportHeight);
if (document.fonts) document.fonts.ready.then(reportHeight);

function refOf(ev) {
  return "trial-" + (ev.start || ev.date).replace(/:\d\dZ$/, "").replace(/[^0-9A-Za-z]+/g, "-").replace(/-$/, "") + (ev.start ? "-utc" : "");
}
function card(ev) {
  const c = el("div", "card");
  c.style.setProperty("--cat", CAT_COLORS[ev.cat] || CAT_COLORS.general);

  const top = el("div", "top");
  top.appendChild(el("span", "lvl", ev.level || "All levels"));
  const left = Math.max(0, MAX_SEATS - (TAKEN[refOf(ev)] || 0));
  const seats = el("span", "seats" + (left === 0 ? " full" : left <= 2 ? " few" : ""),
    left === 0 ? "Sold out" : left === 1 ? "Last seat!" : `${left} seats left`);
  top.appendChild(seats);
  c.appendChild(top);

  c.appendChild(el("h3", null, ev.title));

  const when = el("div", "when");
  const d = new Date(ev.start || ev.date + "T12:00:00");
  when.appendChild(el("strong", null, d.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long", year: "numeric" })));
  if (ev.start) {
    const local = d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
    const both = (ev.times || []).map(t => t.time).join(" / ");
    when.appendChild(el("span", null, local + " your time" + (both ? " (" + both + ")" : "")));
  }
  c.appendChild(when);

  if (ev.topic) c.appendChild(el("p", "topic", ev.topic));

  const bottom = el("div", "bottom");
  bottom.appendChild(el("span", "price", PRICE));
  // client_reference_id tells you in Stripe which session was booked,
  // e.g. "trial-2026-11-08-1300-utc".
  if (left === 0) {
    const out = el("span", "btn out", "Sold out");
    out.setAttribute("aria-disabled", "true");
    bottom.appendChild(out);
  } else {
    const a = el("a", "btn", "Book my seat");
    a.href = BOOK_URL + "?client_reference_id=" + encodeURIComponent(refOf(ev));
    a.target = "_blank";
    a.rel = "noopener";
    // One trial per person: ask for the email first and check it, then go to Stripe with that email locked.
    a.addEventListener("click", () => mzTrack("InitiateCheckout", { value: 2.50, currency: "USD", content_name: ev.title || "Trial session" }));
    if (SEATS_URL) a.addEventListener("click", e => { e.preventDefault(); askEmail(c, bottom, ev); });
    bottom.appendChild(a);
  }
  c.appendChild(bottom);
  return c;
}

// Meta Pixel: tell the Odoo page (which runs the pixel) what the visitor did. The page listens with the
// small "mz-track" snippet in Odoo's <head> code injection (see README). Harmless if nobody listens.
function mzTrack(event, params) {
  try { window.top.postMessage({ mz: "track", event: event, params: params || {} }, "*"); } catch (e) {}
}
function askEmail(c, bottom, ev) {
  bottom.innerHTML = "";
  const f = el("form", "ask");
  const lid = "em-" + Math.random().toString(36).slice(2, 8);
  const lbl = el("label", "asklbl", "Your email"); lbl.htmlFor = lid;
  const inp = el("input"); inp.id = lid; inp.type = "email"; inp.placeholder = "you@email.com"; inp.required = true; inp.autocomplete = "email"; inp.inputMode = "email";
  const go = el("button", "btn", "Continue ↗"); go.type = "submit";
  f.append(lbl, inp, go);
  const msg = el("div", "askmsg", "Trial sessions are one per person. We'll send your Meet link to this email.");
  bottom.append(f);
  c.appendChild(msg);
  setTimeout(() => inp.focus(), 30);
  f.addEventListener("submit", async e => {
    e.preventDefault();
    const email = inp.value.trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { msg.className = "askmsg warn"; msg.textContent = "Please check your email address."; return; }
    go.disabled = true; go.textContent = "Checking…";
    let used = false;
    try { used = (await (await fetch(SEATS_URL + "?check=" + encodeURIComponent(email))).json()).used; } catch (err) {}
    go.disabled = false; go.textContent = "Continue ↗";
    if (used) {
      msg.className = "askmsg"; msg.textContent = "Trial sessions are one per person. We'll send your Meet link to this email.";
      showOnceOnly(f);
      return;
    }
    const url = BOOK_URL + "?client_reference_id=" + encodeURIComponent(refOf(ev)) + "&prefilled_email=" + encodeURIComponent(email) + "&locked_prefilled_email=true";
    mzTrack("AddPaymentInfo", { value: 2.50, currency: "USD", content_name: ev.title || "Trial session" });
    const w = window.open(url, "_blank");
    if (w) { msg.className = "askmsg"; msg.textContent = "Payment opened in a new tab. Your Meet link arrives by email within 5 minutes."; return; }
    // the browser blocked the new tab: give a real link to click instead
    const a = document.createElement("a"); a.className = "btn"; a.href = url; a.target = "_blank"; a.rel = "noopener";
    a.textContent = "Go to secure payment ↗"; a.style.display = "block"; a.style.textAlign = "center";
    f.replaceWith(a);
    msg.className = "askmsg"; msg.textContent = "Your Meet link arrives by email within 5 minutes of paying.";
  });
}

function render(events) {
  const now = new Date();
  const trials = events
    .filter(ev => ev.trial && new Date(ev.start || ev.date + "T23:59:00") > now)
    .sort((a, b) => new Date(a.start || a.date) - new Date(b.start || b.date))
    .slice(0, COUNT);

  if (!trials.length) {
    const box = el("div", "empty");
    box.appendChild(el("strong", null, "New trial dates coming soon"));
    box.appendChild(document.createTextNode("We run 2 trial sessions every month. Check back in a few days."));
    root.appendChild(box);
  } else {
    const shell = el("div", "shell");
    const wrap = el("div", "cards");
    trials.forEach(ev => wrap.appendChild(card(ev)));
    const prev = el("button", "arrow l", "‹"); prev.type = "button"; prev.setAttribute("aria-label", "Earlier sessions");
    const next = el("button", "arrow r", "›"); next.type = "button"; next.setAttribute("aria-label", "More sessions");
    prev.onclick = () => wrap.scrollBy({ left: -wrap.clientWidth * 0.9, behavior: "smooth" });
    next.onclick = () => wrap.scrollBy({ left: wrap.clientWidth * 0.9, behavior: "smooth" });
    const dots = el("div", "dots"); dots.setAttribute("aria-hidden", "true");
    trials.forEach((_, i) => dots.appendChild(el("i", i ? "" : "on")));
    shell.append(prev, wrap, next, dots);
    root.appendChild(shell);
    const update = () => {
      shell.classList.toggle("has-more", wrap.scrollWidth > wrap.clientWidth + 4);
      const cards = wrap.children, w = cards[0].getBoundingClientRect().width + 14;
      let i = Math.round(wrap.scrollLeft / w);
      if (wrap.scrollLeft + wrap.clientWidth >= wrap.scrollWidth - 4) i = cards.length - 1;
      [...dots.children].forEach((d, k) => d.className = k === i ? "on" : "");
    };
    wrap.addEventListener("scroll", update, { passive: true });
    window.addEventListener("resize", update);
    update();
  }
  reportHeight();
}

const seatsReady = SEATS_URL
  ? fetch(SEATS_URL).then(r => r.json()).then(d => { TAKEN = d.taken || {}; }).catch(() => {})
  : Promise.resolve();
Promise.all([fetch("events.json", { cache: "no-cache" }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }), seatsReady])
  .then(([data]) => render(Array.isArray(data.events) ? data.events : []))
  .catch(() => render([]));

// Pop-up shown when an email has already had its trial session.
function showOnceOnly(anchor) {
  document.querySelectorAll(".once, .once-bg").forEach(x => x.remove());
  const bg = document.createElement("div"); bg.className = "once-bg";
  bg.style.height = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight) + "px";
  const box = document.createElement("div"); box.className = "once"; box.setAttribute("role", "dialog"); box.setAttribute("aria-modal", "true");
  box.innerHTML = `<button type="button" class="x" aria-label="Close">×</button>
    <div class="em" aria-hidden="true">🍊</div>
    <h4>One trial session per person</h4>
    <p>You've already had your trial session with this email. Enjoyed the experience? Become a Club member and join as many speaking sessions as you like.</p>
    <a class="go" href="https://www.mandarinzest.com/mandarin-zest-club" target="_blank" rel="noopener">Become a Club member ↗</a>
    <button type="button" class="ok">Close</button>`;
  document.body.append(bg, box);
  const r = anchor.getBoundingClientRect(), docH = parseFloat(bg.style.height);
  let top = r.top + window.scrollY + r.height / 2 - box.offsetHeight / 2;
  top = Math.max(window.scrollY + 8, Math.min(top, docH - box.offsetHeight - 8));
  box.style.top = Math.max(8, top) + "px";
  box.style.left = Math.max(12, (document.documentElement.clientWidth - box.offsetWidth) / 2) + "px";
  const close = () => { box.remove(); bg.remove(); document.removeEventListener("keydown", esc); };
  const esc = e => { if (e.key === "Escape") close(); };
  bg.addEventListener("click", close); box.querySelector(".x").addEventListener("click", close); box.querySelector(".ok").addEventListener("click", close);
  box.querySelector(".go").addEventListener("click", () => setTimeout(close, 100));
  document.addEventListener("keydown", esc);
  box.querySelector(".go").focus({ preventScroll: true });
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mandarin Zest Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Noto+Serif+SC:wght@700&display=swap" rel="stylesheet">
<style>
  /* EDIT TEXT AND LINKS DIRECTLY IN THE HTML BELOW. */
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }
  body { font-family: 'Outfit', system-ui, sans-serif; color: #2a2420; padding: 4px; }
  .banner {
    max-width: 820px; margin: 0 auto; border-radius: 20px; padding: 26px 28px;
    display: flex; gap: 26px; align-items: center;
  }
  .visual { flex: 0 0 150px; height: 150px; position: relative; }
  .text { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; }
  h3 { margin: 0; font-size: 24px; font-weight: 800; line-height: 1.2; }
  p { margin: 0; font-size: 15px; line-height: 1.5; }
  .actions { display: flex; flex-wrap: wrap; gap: 12px 14px; align-items: center; margin-top: 4px; }
  .btn { text-decoration: none; font-weight: 800; font-size: 16px; padding: 13px 22px; border-radius: 999px; }
  .btn:focus-visible, .code:focus-visible { outline: 3px solid #4f7a94; outline-offset: 3px; }
  .side { font-size: 14px; }
  .banner { background: #2a2420; color: #fff; }
  .visual { border-radius: 14px; background: #3a322c; display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 18px; }
  .bubble { font-family: 'Noto Serif SC', serif; font-size: 17px; font-weight: 700; padding: 7px 12px; }
  .b1 { align-self: flex-start; background: #f37a48; color: #2a2420; border-radius: 14px 14px 14px 4px; }
  .b2 { align-self: flex-end; background: #fff; color: #2a2420; border-radius: 14px 14px 4px 14px; }
  .b3 { align-self: flex-start; background: #9fd89f; color: #173f17; border-radius: 14px 14px 14px 4px; }
  .eyebrow { color: #f8dacd; }
  p { color: #e6ddd6; }
  .side { color: #d9cec6; }
  .btn { background: #f37a48; color: #2a2420; }
  .btn:hover { background: #e2632f; }
  @media (max-width: 560px) {
    .banner { flex-direction: column; align-items: flex-start; padding: 22px; gap: 18px; }
    h3 { font-size: 21px; }
  }
</style>
</head>
<body>
<div class="banner">
  <div class="visual" aria-hidden="true">
    <span class="bubble b1">你好！</span>
    <span class="bubble b2">你好！</span>
    <span class="bubble b3">加油</span>
  </div>
  <div class="text">
    <div class="eyebrow">MANDARIN ZEST CLUB</div>
    <h3>Reading is good. Speaking is better.</h3>
    <p>Live 45-minute speaking sessions every week for all levels, plus a new workbook every month. From US$20 a month.</p>
    <div class="actions">
      <a class="btn" href="https://www.mandarinzest.com/mandarin-zest-club" target="_blank" rel="noopener">Discover the Club</a>
      <span class="side">Try a session first for US$2.50</span>
    </div>
  </div>
</div>
<script>
  function reportHeight() {
    var h = Math.ceil(document.querySelector(".banner").getBoundingClientRect().bottom + 6);
    try { parent.postMessage({ mzBanner: "club", height: h }, "*"); } catch (e) {}
  }
  window.addEventListener("load", reportHeight);
  window.addEventListener("resize", reportHeight);
  if (document.fonts) document.fonts.ready.then(reportHeight);

</script>
</body>
</html>

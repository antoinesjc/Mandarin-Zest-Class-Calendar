<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chinese clothing through the dynasties · Mandarin Zest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* Chinese clothing timeline for articles. Illustrations © N. Duong (iridescentdream.com), used with permission.
     Figures are in fashion/f01.jpg … f21.jpg; texts in the FIGS list below. ?start=9 opens on figure 9.
     Embed height: see README. */
  :root { --orange:#f37a48; --orange-d:#e2632f; --peach:#fdf1ea; --green-d:#173f17; --ink:#2a2420; --muted:#5c4f47; --line:#ecdcd2; --cream:#fffaf6; --paper:#e8d6ba; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; }
  body { font-family:'Outfit','Noto Sans SC',system-ui,sans-serif; color:var(--ink); padding:8px 12px; -webkit-font-smoothing:antialiased; }
  button { font-family:inherit; color:inherit; }
  button:focus-visible, a:focus-visible { outline:3px solid #4f7a94; outline-offset:2px; }
  .zh { font-family:'Noto Sans SC',sans-serif; }
  .wrap { max-width:1060px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }

  .eras { display:flex; gap:6px; flex-wrap:wrap; position:relative; }
  .era { border:1.5px solid var(--line); background:var(--cream); border-radius:999px; padding:7px 11px; font-size:13px; font-weight:700; color:var(--muted); cursor:pointer; white-space:nowrap; transition:background .2s, color .2s, border-color .2s; }
  .era b { font-family:'Noto Sans SC',sans-serif; margin-right:4px; }
  .era:hover { border-color:var(--orange); }
  .era.on { background:var(--green-d); border-color:var(--green-d); color:#fff; }

  .card { position:relative; display:grid; grid-template-columns:auto minmax(0,330px) minmax(0,1fr) auto; gap:26px; align-items:center; background:#fff; border:1px solid var(--line); border-radius:28px; padding:22px 24px; }
  .nav { width:46px; height:46px; border-radius:50%; border:0; background:#fff; box-shadow:0 6px 18px rgba(42,36,32,.15); font-size:24px; line-height:1; cursor:pointer; transition:transform .15s; }
  .nav:hover { transform:scale(1.07); } .nav:disabled { opacity:.3; cursor:default; transform:none; }
  .pic { background:var(--paper); border-radius:20px; overflow:hidden; height:440px; display:flex; align-items:flex-end; justify-content:center; touch-action:pan-y; }
  .pic img { height:100%; display:block; user-select:none; -webkit-user-drag:none; }
  .fade { animation:fade .35s ease; }
  @keyframes fade { from { opacity:0; transform:translateY(6px); } }
  .eyebrow { font-size:12.5px; font-weight:800; letter-spacing:.12em; color:#a8431a; text-transform:uppercase; }
  .dates { font-size:15px; font-weight:700; color:var(--muted); margin:8px 0 4px; }
  h2 { margin:0 0 12px; font-size:clamp(24px,3vw,32px); line-height:1.12; font-weight:800; }
  .term { display:inline-flex; flex-wrap:wrap; gap:8px; align-items:baseline; background:var(--peach); border-radius:12px; padding:8px 12px; margin-bottom:14px; }
  .term b { font-family:'Noto Sans SC',sans-serif; font-size:22px; }
  .term span { font-size:14px; color:#a8431a; font-weight:700; }
  .desc { font-size:16px; color:#4a3c34; line-height:1.55; margin:0; max-width:460px; }
  .dots { margin-top:18px; display:flex; gap:5px; flex-wrap:wrap; }
  .dots i { width:6px; height:6px; border-radius:3px; background:var(--line); transition:width .2s, background .2s; }
  .dots i.on { width:18px; background:var(--orange); }

  .strip { position:relative; display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding:2px 2px 4px; scroll-behavior:smooth; }
  .strip::-webkit-scrollbar { display:none; }
  .th { flex:none; width:58px; border:0; background:none; padding:0; cursor:pointer; text-align:center; font-size:11px; font-weight:700; color:#9a8b82; }
  .th img { width:58px; height:82px; object-fit:cover; object-position:top; border-radius:10px; border:2px solid transparent; display:block; margin-bottom:3px; opacity:.7; transition:opacity .2s, border-color .2s; background:var(--paper); }
  .th:hover img { opacity:1; }
  .th.on img { border-color:var(--orange); opacity:1; } .th.on { color:#a8431a; }
  .credit { text-align:center; font-size:12.5px; color:var(--muted); }
  .credit a { color:var(--muted); }

  @media (max-width:760px) {
    body { padding:6px 0; }
    .eras { flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; padding:0 12px; }
    .eras::-webkit-scrollbar { display:none; }
    .card { grid-template-columns:minmax(0,1fr); gap:0; padding:0; overflow:hidden; border-radius:24px; margin:0 12px; }
    .pic { border-radius:0; height:330px; }
    .nav { position:absolute; top:146px; width:38px; height:38px; font-size:20px; z-index:2; }
    .nav.prev { left:10px; } .nav.next { right:10px; }
    .text { padding:16px 18px 18px; min-height:290px; }
    h2 { font-size:23px; margin-bottom:10px; }
    .term { padding:6px 10px; margin-bottom:10px; } .term b { font-size:19px; } .term span { font-size:13px; }
    .desc { font-size:14.5px; line-height:1.5; }
    .dots { margin-top:12px; }
    .strip { padding:2px 12px 4px; }
  }
  @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation:none !important; transition:none !important; scroll-behavior:auto !important; } }
</style>
</head>
<body>
<div class="wrap">
  <nav class="eras" id="eras" aria-label="Dynasties"></nav>

  <section class="card" aria-roledescription="carousel" aria-label="Chinese clothing through the dynasties">
    <button class="nav prev" id="prev" type="button" aria-label="Previous figure">‹</button>
    <div class="pic" id="pic"><img id="img" alt=""></div>
    <div class="text" id="text" aria-live="polite">
      <div class="eyebrow" id="eyebrow"></div>
      <div class="dates" id="dates"></div>
      <h2 id="title"></h2>
      <div class="term" id="term"></div>
      <p class="desc" id="desc"></p>
      <div class="dots" id="dots" aria-hidden="true"></div>
    </div>
    <button class="nav next" id="next" type="button" aria-label="Next figure">›</button>
  </section>

  <div class="strip" id="strip" aria-label="All figures"></div>
  <div class="credit">Illustrations © N. Duong · <a href="https://iridescentdream.com" target="_blank" rel="noopener">iridescentdream.com</a></div>
</div>

<script>
// Dynasties shown in the top bar.
const ERAS = [
  { zh: "秦汉", en: "Qin–Han" }, { zh: "魏晋南北朝", en: "Wei–Jin & N/S" }, { zh: "隋", en: "Sui" }, { zh: "唐", en: "Tang" },
  { zh: "宋", en: "Song" }, { zh: "元", en: "Yuan" }, { zh: "明", en: "Ming" }, { zh: "清", en: "Qing" },
  { zh: "民国", en: "Republic" }, { zh: "今", en: "Today" },
];
// One entry per figure (fashion/f01.jpg …). e = index in ERAS, y = year shown under the thumbnail.
const FIGS = [
  { e: 0, y: "221 BCE", dates: "221 BCE – 220 AD · Qin and Han", title: "The wrapped robe", zh: "曲裾", py: "qūjū · curved-hem robe",
    d: "A one-piece robe whose front panel spirals around the body. It was the main formal wear for women." },
  { e: 1, y: "220", dates: "220 – 420 AD · Wei and Jin", title: "Loose and flowing", zh: "间色裙", py: "jiànsèqún · striped skirt",
    d: "Clothing became large and loose: wide sleeves over a long skirt sewn from strips of alternating colours." },
  { e: 1, y: "420", dates: "420 – 589 AD · Northern dynasties", title: "Northern influence",
    d: "The north was ruled by peoples from the steppe, and Han clothing mixed with their styles: fitted jackets over long, full skirts." },
  { e: 1, y: "220", dates: "220 – 589 AD · Wei, Jin, Southern and Northern dynasties", title: "Swallowtails and streamers", zh: "杂裾垂髾", py: "zájū chuíshāo",
    d: "Pointed layers hang from the waist like swallowtails, with long ribbons that flutter when walking. A famously elegant look of the period." },
  { e: 1, y: "420", dates: "420 – 589 AD · Southern and Northern dynasties", title: "Layers on layers",
    d: "Layered skirts, decorated aprons and huge sleeves: fashion stayed loose and airy, matching the free-spirited ideals of the time." },
  { e: 2, y: "581", dates: "581 – 618 AD · Sui", title: "The high waist arrives", zh: "襦裙", py: "rúqún · top and skirt",
    d: "A short top with a long skirt tied high above the waist. The Tang would make this look famous." },
  { e: 3, y: "618", dates: "618 – 907 AD · early Tang", title: "Early Tang elegance", zh: "披帛", py: "pībó · silk shawl",
    d: "Early Tang clothing followed the Sui: a high-waisted skirt, a short top and a long silk scarf draped over the arms." },
  { e: 3, y: "618", dates: "618 – 907 AD · Tang", title: "Open to the world", zh: "半臂", py: "bànbì · half-sleeve jacket",
    d: "The Tang was the dynasty most open to foreign influence along the Silk Road, and its own fashions spread to Japan and Korea." },
  { e: 3, y: "618", dates: "618 – 907 AD · mid to late Tang", title: "Looser, bolder, more luxurious", zh: "大袖衫", py: "dàxiùshān · wide-sleeved robe",
    d: "In the later Tang, women's clothing became looser and more lavish: very wide sleeves, sheer silk layers over a high-waisted skirt, and fuller figures were in fashion." },
  { e: 4, y: "960", dates: "960 – 1279 AD · Song", title: "Modest and slender", zh: "褙子", py: "bèizi · long open jacket",
    d: "A long, straight jacket left open over a skirt: Song fashion became more modest and restrained. Foot-binding began among aristocratic women in this period." },
  { e: 5, y: "1271", dates: "1271 – 1368 AD · Yuan", title: "Under Mongol rule",
    d: "China came under Mongol rule. Han women kept their jackets and skirts, while Mongol robes and accessories appeared at court." },
  { e: 6, y: "1368", dates: "1368 – 1644 AD · Ming", title: "Han style restored", zh: "汉服", py: "hànfú · Han clothing",
    d: "The Ming restored native Han dress and abolished Yuan customs: crossed collars, long jackets and flowing skirts came back." },
  { e: 6, y: "1368", dates: "1368 – 1644 AD · Ming", title: "The pleated “horse-face” skirt", zh: "马面裙", py: "mǎmiànqún",
    d: "A short jacket worn over a pleated skirt with flat panels at the front and back, one of the most recognisable Ming looks." },
  { e: 6, y: "1368", dates: "1368 – 1644 AD · Ming", title: "The long open coat", zh: "披风", py: "pīfēng · long coat",
    d: "A long coat with a standing collar, worn open over a jacket and skirt. Gold buttons and embroidered collars were popular." },
  { e: 7, y: "1644", dates: "1644 – 1911 AD · Qing", title: "Under the Manchus", zh: "袄裙", py: "ǎoqún · jacket and skirt",
    d: "China was ruled by the Manchus. Han women kept wearing a jacket and skirt, now decorated with wide contrasting trims." },
  { e: 7, y: "1644", dates: "1644 – 1911 AD · Qing", title: "Bold trims, wide sleeves", zh: "镶滚", py: "xiānggǔn · layered trim",
    d: "Wide-sleeved jackets over trousers, edged with layers of embroidered trim. The Manchu rulers tried several times to ban foot-binding, without success." },
  { e: 8, y: "1911", dates: "1911 – 1920s · Republic of China", title: "The new student look", zh: "文明新装", py: "wénmíng xīnzhuāng · “civilised new dress”",
    d: "After the fall of the empire, students and modern women wore a curved-hem jacket with a plain dark skirt." },
  { e: 8, y: "1920s", dates: "1920s · Republic of China", title: "The first qipao", zh: "旗袍", py: "qípáo",
    d: "Originally a robe worn by the Manchus, the qipao was adopted by Chinese women in the 1920s. Early versions were loose and straight." },
  { e: 8, y: "1930s", dates: "1930s – 1940s · Republic of China", title: "Shanghai style", zh: "旗袍", py: "qípáo",
    d: "The qipao became fitted and more Western, with shorter sleeves and high side slits. By 1949, foot-binding had disappeared." },
  { e: 8, y: "1940s", dates: "1940s – 1960s · Hong Kong", title: "Cheongsam in Hong Kong", zh: "长衫", py: "cheongsam (Cantonese)",
    d: "Known as the cheongsam in Cantonese, the qipao stayed everyday wear in Hong Kong until the late 1960s." },
  { e: 9, y: "Today", dates: "21st century", title: "Modern era", zh: "旗袍", py: "qípáo",
    d: "Today the qipao is mostly worn for weddings and celebrations, while the hanfu revival brings earlier dynasty styles back to the streets." },
];

const $ = id => document.getElementById(id);
const src = i => `fashion/f${String(i + 1).padStart(2, "0")}.jpg`;
let cur = Math.min(FIGS.length - 1, Math.max(0, (parseInt(new URLSearchParams(location.search).get("start"), 10) || 1) - 1));

$("eras").innerHTML = ERAS.map((r, i) => `<button type="button" class="era" data-e="${i}"><b>${r.zh}</b>${r.en}</button>`).join("");
$("strip").innerHTML = FIGS.map((f, i) => `<button type="button" class="th" data-i="${i}" aria-label="Figure ${i + 1}: ${f.dates}"><img src="${src(i)}" alt="" loading="lazy">${f.y}</button>`).join("");
$("dots").innerHTML = FIGS.map(() => "<i></i>").join("");

function show(i, anim = true) {
  cur = (i + FIGS.length) % FIGS.length;
  const f = FIGS[cur], era = ERAS[f.e];
  $("img").src = src(cur);
  $("img").alt = `Illustration of women's clothing, ${f.dates}`;
  $("eyebrow").innerHTML = `Figure ${cur + 1} of ${FIGS.length} · <span class="zh">${era.zh}</span> ${era.en}`;
  $("dates").textContent = f.dates;
  $("title").textContent = f.title;
  $("term").hidden = !f.zh;
  $("term").innerHTML = f.zh ? `<b>${f.zh}</b><span>${f.py || ""}</span>` : "";
  $("desc").textContent = f.d;
  [...$("dots").children].forEach((d, k) => d.classList.toggle("on", k === cur));
  document.querySelectorAll(".era").forEach(b => b.classList.toggle("on", +b.dataset.e === f.e));
  document.querySelectorAll(".th").forEach(b => b.classList.toggle("on", +b.dataset.i === cur));
  $("prev").disabled = cur === 0; $("next").disabled = cur === FIGS.length - 1;
  if (anim) { ["pic", "text"].forEach(id => { const el = $(id); el.classList.remove("fade"); void el.offsetWidth; el.classList.add("fade"); }); }
  // keep the current thumbnail and dynasty in view (without moving the page)
  const th = document.querySelector(".th.on"), s = $("strip");
  if (th) s.scrollLeft = th.offsetLeft - s.clientWidth / 2 + th.offsetWidth / 2;
  const er = document.querySelector(".era.on"), e = $("eras");
  if (er && e.scrollWidth > e.clientWidth) e.scrollLeft = er.offsetLeft - e.clientWidth / 2 + er.offsetWidth / 2;
  if (cur + 1 < FIGS.length) new Image().src = src(cur + 1);
}
$("prev").onclick = () => show(cur - 1);
$("next").onclick = () => show(cur + 1);
$("strip").addEventListener("click", e => { const b = e.target.closest(".th"); if (b) show(+b.dataset.i); });
$("eras").addEventListener("click", e => { const b = e.target.closest(".era"); if (b) show(FIGS.findIndex(f => f.e === +b.dataset.e)); });
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") show(cur + 1); if (e.key === "ArrowLeft") show(cur - 1); });
// swipe on the picture
let x0 = null;
$("pic").addEventListener("pointerdown", e => { x0 = e.clientX; });
$("pic").addEventListener("pointerup", e => { if (x0 === null) return; const dx = e.clientX - x0; x0 = null; if (Math.abs(dx) > 40) show(cur + (dx < 0 ? 1 : -1)); });
$("pic").addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
$("pic").addEventListener("touchend", e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 40) show(cur + (dx < 0 ? 1 : -1)); });

show(cur, false);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What learners say</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  /* Learner reviews that slide in from the side in an endless loop (no title).
     Hover or touch pauses it. Use a 250px frame. Edit the reviews in the REVIEWS list at the bottom. */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: 'Outfit', system-ui, sans-serif; color: #2a2420; display: flex; align-items: center; }

  .viewport {
    width: 100%; overflow: hidden; padding: 12px 0;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
  }
  .track { display: flex; gap: 18px; width: max-content; animation: slide var(--dur, 60s) linear infinite; }
  .viewport:hover .track, .viewport.paused .track { animation-play-state: paused; }
  @keyframes slide { from { transform: translateX(0); } to { transform: translateX(calc(-50% - 9px)); } }

  .card {
    flex: none; width: 330px; height: 206px; background: #fff; border: 1px solid #ecdcd2; border-radius: 20px;
    padding: 20px 22px; display: flex; flex-direction: column; gap: 10px;
    transition: transform .25s, box-shadow .25s;
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 14px 28px rgba(42,36,32,.12); }
  .card.club { background: #e0f4e0; border-color: #e0f4e0; }
  q { quotes: "\201C" "\201D"; font-size: 15.5px; line-height: 1.5; color: #3b322d; flex: 1; overflow: hidden; }
  .club q { color: #213b21; }
  .short q { font-size: 21px; font-weight: 700; line-height: 1.35; color: #2a2420; }
  .who { display: flex; align-items: center; gap: 10px; }
  .av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 16px; flex: none; background: #f8dacd; color: #a8431a; }
  .club .av { background: #fff; color: #1b6f1b; }
  .name { font-weight: 800; font-size: 15px; line-height: 1.2; }
  .meta { font-size: 13px; color: #7a6a60; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .club .meta { color: #3d6a3d; }
  .who > div { min-width: 0; }

  @media (max-width: 480px) {
    .card { width: 270px; height: 214px; padding: 18px; }
    q { font-size: 14.5px; }
    .short q { font-size: 19px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .viewport { overflow-x: auto; -webkit-mask-image: none; mask-image: none; padding: 12px 16px; }
    .track { animation: none; }
    .card.copy { display: none; }
  }
</style>
</head>
<body>
<div class="viewport" id="vp"><div class="track" id="track"></div></div>

<script>
  // ═══════════════ REVIEWS: edit, add or remove lines here ═══════════════
  // club: true = green Club card
  var REVIEWS = [
    { name: "Nancy", from: "USA", about: "Club · Advanced Session", club: true,
      text: "The challenging weekly readings are exactly what I was looking for, and the discussions give me a chance to actively use new vocabulary in conversation." },
    { name: "Tina A.", from: "Italy", about: "HSK 1 Complete Learning Bundle",
      text: "Really happy with this bundle!" },
    { name: "Matt", from: "South Africa", about: "Mandarin Zest Club", club: true,
      text: "The teachers are friendly, patient and supportive, and the materials are excellent and easy to follow. I've learned a lot in a short time!" },
    { name: "Marek", from: "Poland", about: "Unlocking Chinese Characters",
      text: "Super nice explained and very detailed." },
    { name: "Debbie", from: "USA", about: "Mandarin Zest Club", club: true,
      text: "A game-changer for anyone learning Chinese! There's truly nothing else out there like this club. The community is so supportive." },
    { name: "Agnieszka", from: "Poland", about: "Little Mandarin and the Zombie Apocalypse",
      text: "Fun graded reader, appropriate for about HSK4 learners!" },
    { name: "Mariana C.", from: "Brazil", about: "Chinese Zodiac: the Great Race",
      text: "The story is genuinely interesting and it makes learning Chinese feel much more like reading something enjoyable." }
  ];
  // ═══════════════════════════════════════════════════════════════════════

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function card(r, copy) {
    return '<figure class="card' + (r.club ? " club" : "") + (r.text.length < 70 ? " short" : "") + (copy ? " copy" : "") + '" style="margin:0"' + (copy ? ' aria-hidden="true"' : "") + ">" +
      "<q>" + esc(r.text) + "</q>" +
      '<figcaption class="who"><span class="av" aria-hidden="true">' + esc(r.name.charAt(0)) + "</span><div>" +
      '<div class="name">' + esc(r.name) + ' <span style="font-weight:500;color:inherit;opacity:.65">· ' + esc(r.from) + "</span></div>" +
      '<div class="meta">' + esc(r.about) + "</div></div></figcaption></figure>";
  }
  var track = document.getElementById("track"), vp = document.getElementById("vp");
  track.innerHTML = REVIEWS.map(function (r) { return card(r, false); }).join("") +
                    REVIEWS.map(function (r) { return card(r, true); }).join("");
  // about 9 seconds per review, whatever the number of reviews
  track.style.setProperty("--dur", (REVIEWS.length * 9) + "s");

  // Touch: tap to pause, tap again to resume.
  vp.addEventListener("pointerdown", function (e) { if (e.pointerType !== "mouse") vp.classList.toggle("paused"); });
</script>
</body>
</html>

name: Sync class calendar

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # "Run workflow" button for an instant refresh

permissions:
  contents: write

concurrency:
  group: sync-calendar
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install icalendar recurring-ical-events

      - name: Build events.json from the private calendar feed
        env:
          CALENDAR_ICS_URL: ${{ secrets.CALENDAR_ICS_URL }}
        run: python scripts/build_events.py

      - name: Build hosts.json from the "Meet your hosts" cards on the Club page
        continue-on-error: true      # if the Club page can't be read, keep the previous hosts.json
        run: python scripts/build_hosts.py

      - name: Commit if the sessions changed
        run: |
          if git diff --quiet -- events.json hosts.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add events.json hosts.json
          git commit -m "Update sessions (and hosts) from Google Calendar and the Club page"
          # Someone may have pushed while this ran: put our commit on top and retry.
          for i in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep 10
          done
          exit 1

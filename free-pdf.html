<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free PDF · Mandarin Zest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Free PDF for an email: free-pdf.html?pdf=hsk-1. Email + consent → Start Here sheet (source "free-pdf | <id>")
     → "Download the PDF" button. The PDFs are listed in downloads/free-pdfs.js. Embed height: see README. */
  :root { --ink:#2a2420; --orange:#f37a48; --orange-d:#e2632f; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; }
  body { font-family:'Outfit',system-ui,sans-serif; color:var(--ink); -webkit-font-smoothing:antialiased; padding:4px; }
  .card { max-width:820px; margin:0 auto; background:#f8dacd; border-radius:22px; padding:26px 30px; display:flex; gap:30px; align-items:center; }
  .cover { flex:none; position:relative; width:136px; }
  .cover img { display:block; width:128px; border-radius:8px; box-shadow:0 10px 22px rgba(42,36,32,.18); transform:rotate(-4deg); transition:transform .3s; }
  .card:hover .cover img { transform:rotate(-1deg) translateY(-3px); }
  .cover::before { content:""; position:absolute; left:10px; top:6px; width:128px; height:calc(100% - 4px); border-radius:8px; background:#fff; box-shadow:0 10px 22px rgba(42,36,32,.12); transform:rotate(6deg); }
  .tick { position:absolute; right:-8px; top:-8px; width:42px; height:42px; border-radius:50%; background:#1b6f1b; display:none; place-items:center; box-shadow:0 6px 14px rgba(27,111,27,.3); }
  .done .tick { display:grid; }
  .main { flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:9px; }
  .eyebrow { font-size:12.5px; font-weight:800; letter-spacing:.09em; color:#a8431a; }
  .done .eyebrow { color:#1b6f1b; }
  h2 { margin:0; font-size:25px; font-weight:800; line-height:1.15; }
  p { margin:0; font-size:15px; line-height:1.45; color:#4a3c34; }
  form { display:flex; flex-direction:column; gap:8px; margin-top:4px; }
  .row { display:flex; gap:10px; }
  input[type=email] { flex:1; min-width:0; height:48px; border:2px solid transparent; border-radius:999px; padding:0 18px; font:inherit; font-size:15.5px; background:#fff; color:var(--ink); }
  input[type=email]:focus { outline:none; border-color:var(--orange-d); }
  .btn { display:inline-flex; align-items:center; justify-content:center; height:48px; padding:0 22px; border:0; border-radius:999px; background:var(--orange); color:var(--ink);
         font:inherit; font-size:15.5px; font-weight:800; white-space:nowrap; cursor:pointer; text-decoration:none; transition:background .2s, transform .2s; }
  .btn:hover { background:var(--orange-d); transform:translateY(-1px); }
  .btn.dark { background:var(--ink); color:#fff; } .btn.dark:hover { background:#000; }
  .consent { display:flex; gap:8px; align-items:flex-start; font-size:12.5px; line-height:1.4; color:#4a3c34; cursor:pointer; }
  .consent input { width:16px; height:16px; margin:1px 0 0; flex:none; accent-color:var(--orange-d); }
  .err { color:#a3261a; font-size:13px; font-weight:700; min-height:0; }
  .trap { position:absolute; left:-5000px; }
  .after { display:none; flex-wrap:wrap; gap:12px 16px; align-items:center; margin-top:4px; }
  .done .after { display:flex; } .done form { display:none; }
  .club { font-size:14.5px; font-weight:700; color:#a8431a; }
  .club:hover { color:#7a2f12; }

  @media (max-width:600px) {
    body { padding:2px; }
    .card { flex-direction:column; align-items:stretch; gap:14px; padding:20px 18px; border-radius:20px; }
    .top { display:flex; gap:16px; align-items:center; }
    .cover { width:80px; } .cover img { width:76px; border-radius:6px; } .cover::before { display:none; }
    .tick { width:30px; height:30px; right:-6px; top:-6px; } .tick svg { width:16px; height:16px; }
    h2 { font-size:20px; }
    .row { flex-direction:column; } .row input[type=email] { flex:none; }
    p { font-size:14.5px; }
  }
  @media (min-width:601px) { .top { display:contents; } .top .eyebrow, .top h2 { display:none; } }
</style>
</head>
<body>
<section class="card" id="card" aria-live="polite">
  <div class="top">
    <div class="cover"><img id="cover" src="" alt="">
      <span class="tick"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
    </div>
    <div class="phonehead"><div class="eyebrow" data-eb>FREE PDF</div><h2 data-h></h2></div>
  </div>
  <div class="main">
    <div class="eyebrow deskonly" data-eb>FREE PDF</div>
    <h2 class="deskonly" data-h></h2>
    <p id="text"></p>
    <form id="form" novalidate>
      <div class="row">
        <input type="email" id="email" placeholder="Your email" autocomplete="email" aria-label="Your email">
        <button class="btn" type="submit">Get the PDF ↓</button>
      </div>
      <label class="consent"><input type="checkbox" id="ok">I agree to receive emails from Mandarin Zest. I can unsubscribe at any time.</label>
      <input class="trap" type="text" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="err" id="err" role="alert"></div>
    </form>
    <div class="after">
      <a class="btn dark" id="dl" href="#" download target="_blank" rel="noopener">Download the PDF ↓</a>
      <a class="club" href="https://www.mandarinzest.com/mandarin-zest-club-trial-session" target="_blank" rel="noopener">Practise them out loud: try a Club session ↗</a>
    </div>
  </div>
</section>
<script>
// Load the PDF list fresh every time (browsers may otherwise keep an older copy for 10 minutes).
function start() {
  var SHEET_URL = "https://script.google.com/macros/s/AKfycbwPWbx4dg8r7HWMa_uMV-2ZH6Xis7VnzEWvUgVc8G3AUzY4lnrtaooCZGgsDrwHZ9VMYg/exec"; // Start Here sheet
  var id = (new URLSearchParams(location.search).get("pdf") || "hsk-1").toLowerCase();
  var P = FREE_PDFS[id];
  if (!P) { document.getElementById("card").innerHTML = '<p style="margin:0">This PDF is coming soon. Please check back later.</p>'; return; }
  var card = document.getElementById("card");

  // phones show the title next to the cover, computers next to the form
  var css = document.createElement("style");
  css.textContent = "@media (max-width:600px){.deskonly{display:none}} @media (min-width:601px){.phonehead{display:none}}";
  document.head.appendChild(css);

  function fill() {
    var isDone = card.classList.contains("done");
    document.querySelectorAll("[data-eb]").forEach(function (e) { e.textContent = isDone ? "YOU'RE IN · 谢谢！" : "FREE PDF"; });
    document.querySelectorAll("[data-h]").forEach(function (e) { e.textContent = isDone ? P.done : P.title; });
    document.getElementById("text").textContent = isDone ? "Save it, print it, and tick off the words you know." : P.text;
  }
  var cover = document.getElementById("cover"); cover.src = P.cover; cover.alt = "Cover of the " + P.tag + " PDF";
  document.getElementById("dl").href = P.file;
  var KEY = "mz-free-pdf-" + id;
  try { if (localStorage.getItem(KEY) === "1") card.classList.add("done"); } catch (e) {}
  fill();

  document.getElementById("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var email = document.getElementById("email").value.trim(), err = document.getElementById("err");
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { err.textContent = "Please enter a valid email."; return; }
    if (!document.getElementById("ok").checked) { err.textContent = "Please tick the box to get the PDF."; return; }
    err.textContent = "";
    if (!document.getElementById("website").value) {
      fetch(SHEET_URL, { method:"POST", mode:"no-cors", keepalive:true, headers:{ "Content-Type":"text/plain;charset=utf-8" },
        body: JSON.stringify({ email: email, source: "free-pdf | " + id, timestamp: new Date().toISOString() }) }).catch(function () {});
      try { window.top.postMessage({ mz: "track", event: "Lead", params: { content_name: "Free PDF " + P.tag }, ga: { event: "generate_lead", params: { form: "free-pdf", pdf: id } } }, "*"); } catch (e2) {}
    }
    try { localStorage.setItem(KEY, "1"); } catch (e3) {}
    card.classList.add("done"); fill();
  });
}
(function () {
  var sc = document.createElement("script");
  sc.src = "downloads/free-pdfs.js?v=" + Math.floor(Date.now() / 60000);
  sc.onload = start;
  sc.onerror = function () { document.getElementById("card").innerHTML = '<p style="margin:0">The PDF could not load. Please refresh the page.</p>'; };
  document.head.appendChild(sc);
})();
</script>
</body>
</html>

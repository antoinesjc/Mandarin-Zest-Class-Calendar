<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mandarin Zest Club trial sessions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Noto+Serif+SC:wght@600&display=swap" rel="stylesheet">
<style>
  /* Shows the upcoming sessions with #trial in their Google Calendar description.
     Shows every upcoming trial session (up to 8). Two fit side by side; when there
     are more, visitors swipe or use the arrows. Optional: ?count=2 to limit. Use a 340px frame. */
  :root {
    --ink: #2a2420;
    --muted: #5c4f47;
    --green: #1b6f1b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }
  body { font-family: 'Outfit', 'Noto Serif SC', system-ui, sans-serif; color: var(--ink); padding: 16px 16px 8px; }
  .shell { position: relative; max-width: 1060px; margin: 0 auto; }
  .shell.has-more { padding: 0 30px; }
  .cards {
    display: flex; gap: 24px; overflow-x: auto; scroll-snap-type: x mandatory;
    padding: 4px 4px 14px; scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .cards::-webkit-scrollbar { display: none; }
  .card { flex: 0 0 calc((100% - 24px) / 2); min-width: 280px; scroll-snap-align: start; }
  .card:first-child { margin-left: auto; } .card:last-child { margin-right: auto; }
  .arrow {
    position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; border: 0;
    background: #fff; box-shadow: 0 6px 18px rgba(42,36,32,.18); font-size: 22px; cursor: pointer; display: none; z-index: 2; font-family: inherit; color: var(--ink);
  }
  .arrow.l { left: -6px; } .arrow.r { right: -6px; }
  .has-more .arrow { display: block; }
  .dots { display: none; justify-content: center; gap: 6px; }
  .has-more .dots { display: flex; }
  .dots i { width: 6px; height: 6px; border-radius: 3px; background: #e3d3c9; transition: width .2s, background .2s; }
  .dots i.on { background: #1b6f1b; width: 16px; }
  .card {
    background: #ffffff;
    border-radius: 20px;
    border-top: 6px solid var(--cat, #6b6559);
    padding: 26px 28px;
    box-shadow: 0 1px 0 #efe2d9, 0 8px 24px rgba(42, 36, 32, 0.06);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .lvl { font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: #f1ece8; color: var(--muted); }
  .seats { font-size: 13px; font-weight: 700; color: #a8431a; }
  h3 { margin: 0; font-size: 23px; font-weight: 800; line-height: 1.2; }
  .when { display: flex; flex-direction: column; gap: 3px; font-size: 16px; }
  .when span { color: var(--muted); font-size: 15px; }
  .topic { margin: 0; font-size: 15px; line-height: 1.5; color: var(--muted); }
  .bottom { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: auto; padding-top: 6px; flex-wrap: wrap; }
  .price { font-size: 28px; font-weight: 800; }
  .btn {
    background: var(--green);
    color: #ffffff;
    text-decoration: none;
    font-weight: 700;
    font-size: 16px;
    padding: 13px 26px;
    border-radius: 999px;
  }
  .btn:hover { background: #145514; }
  .btn:focus-visible { outline: 3px solid #4f7a94; outline-offset: 3px; }
  .soon { font-size: 15px; font-weight: 600; color: var(--muted); }
  .empty {
    max-width: 640px;
    margin: 0 auto;
    text-align: center;
    background: #ffffff;
    border-radius: 20px;
    padding: 32px 24px;
    font-size: 17px;
    line-height: 1.5;
    color: var(--muted);
  }
  .empty strong { display: block; color: var(--ink); font-size: 20px; margin-bottom: 6px; }
  @media (max-width: 760px) {
    body { padding: 10px 0 4px; }
    .shell.has-more { padding: 0; }
    .cards { gap: 14px; padding: 4px 16px 10px; scroll-padding-left: 16px; }
    .card { flex-basis: 86%; max-width: 420px; min-width: 0; padding: 18px 20px; gap: 9px; }
    .arrow { display: none !important; }
    h3 { font-size: 20px; } .when { font-size: 15px; } .when span { font-size: 13.5px; }
    .bottom { flex-wrap: nowrap; gap: 10px; padding-top: 2px; }
    .price { font-size: 23px; } .btn { padding: 11px 18px; font-size: 15px; white-space: nowrap; }
  }
</style>
</head>
<body>
<div id="root" aria-live="polite"></div>

<script>
// Price and booking link for every trial session. Change them here.
const PRICE = "US$2.50";
const BOOK_URL = "https://buy.stripe.com/cNi6oH94B8Dj6DCf0x6oo0k";
const SEATS = "5 seats";

const CAT_COLORS = {
  advanced: "#3f6d5e", intermediate: "#4f7a94", beginner: "#b98a3d",
  native: "#a63d2f", character: "#7d5a8c", general: "#6b6559",
};

const params = new URLSearchParams(location.search);
const COUNT = Math.min(8, Math.max(1, parseInt(params.get("count"), 10) || 8));
const root = document.getElementById("root");

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function reportHeight() {
  const h = Math.ceil(root.getBoundingClientRect().bottom + 24);
  try { parent.postMessage({ mzTrialHeight: h }, "*"); } catch (e) {}
}
window.addEventListener("resize", reportHeight);
if (document.fonts) document.fonts.ready.then(reportHeight);

function card(ev) {
  const c = el("div", "card");
  c.style.setProperty("--cat", CAT_COLORS[ev.cat] || CAT_COLORS.general);

  const top = el("div", "top");
  top.appendChild(el("span", "lvl", ev.level || "All levels"));
  top.appendChild(el("span", "seats", SEATS));
  c.appendChild(top);

  c.appendChild(el("h3", null, ev.title));

  const when = el("div", "when");
  const d = new Date(ev.start || ev.date + "T12:00:00");
  when.appendChild(el("strong", null, d.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long", year: "numeric" })));
  if (ev.start) {
    const local = d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
    const both = (ev.times || []).map(t => t.time).join(" / ");
    when.appendChild(el("span", null, local + " your time" + (both ? " (" + both + ")" : "")));
  }
  c.appendChild(when);

  if (ev.topic) c.appendChild(el("p", "topic", ev.topic));

  const bottom = el("div", "bottom");
  bottom.appendChild(el("span", "price", PRICE));
  // client_reference_id tells you in Stripe which session was booked,
  // e.g. "trial-2026-11-08-1300-utc".
  const ref = "trial-" + (ev.start || ev.date).replace(/:\d\dZ$/, "").replace(/[^0-9A-Za-z]+/g, "-").replace(/-$/, "") + (ev.start ? "-utc" : "");
  const a = el("a", "btn", "Book my seat");
  a.href = BOOK_URL + "?client_reference_id=" + encodeURIComponent(ref);
  a.target = "_blank";
  a.rel = "noopener";
  bottom.appendChild(a);
  c.appendChild(bottom);
  return c;
}

function render(events) {
  const now = new Date();
  const trials = events
    .filter(ev => ev.trial && new Date(ev.start || ev.date + "T23:59:00") > now)
    .sort((a, b) => new Date(a.start || a.date) - new Date(b.start || b.date))
    .slice(0, COUNT);

  if (!trials.length) {
    const box = el("div", "empty");
    box.appendChild(el("strong", null, "New trial dates coming soon"));
    box.appendChild(document.createTextNode("We run 2 trial sessions every month. Check back in a few days."));
    root.appendChild(box);
  } else {
    const shell = el("div", "shell");
    const wrap = el("div", "cards");
    trials.forEach(ev => wrap.appendChild(card(ev)));
    const prev = el("button", "arrow l", "‹"); prev.type = "button"; prev.setAttribute("aria-label", "Earlier sessions");
    const next = el("button", "arrow r", "›"); next.type = "button"; next.setAttribute("aria-label", "More sessions");
    prev.onclick = () => wrap.scrollBy({ left: -wrap.clientWidth * 0.9, behavior: "smooth" });
    next.onclick = () => wrap.scrollBy({ left: wrap.clientWidth * 0.9, behavior: "smooth" });
    const dots = el("div", "dots"); dots.setAttribute("aria-hidden", "true");
    trials.forEach((_, i) => dots.appendChild(el("i", i ? "" : "on")));
    shell.append(prev, wrap, next, dots);
    root.appendChild(shell);
    const update = () => {
      shell.classList.toggle("has-more", wrap.scrollWidth > wrap.clientWidth + 4);
      const cards = wrap.children, w = cards[0].getBoundingClientRect().width + 14;
      let i = Math.round(wrap.scrollLeft / w);
      if (wrap.scrollLeft + wrap.clientWidth >= wrap.scrollWidth - 4) i = cards.length - 1;
      [...dots.children].forEach((d, k) => d.className = k === i ? "on" : "");
    };
    wrap.addEventListener("scroll", update, { passive: true });
    window.addEventListener("resize", update);
    update();
  }
  reportHeight();
}

fetch("events.json", { cache: "no-cache" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(data => render(Array.isArray(data.events) ? data.events : []))
  .catch(() => render([]));
</script>
</body>
</html>

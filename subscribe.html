<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subscribe · Mandarin Zest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Thin mailing list bar: email + consent → Start Here sheet (source "subscribe-bar | <page>").
     ?bg=f8dacd changes the background colour. Embed height: see README. */
  :root { --ink:#2a2420; --orange:#f37a48; --orange-d:#e2632f; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; }
  body { font-family:'Outfit',system-ui,sans-serif; color:var(--ink); -webkit-font-smoothing:antialiased; padding:2px; }
  .bar { max-width:1000px; margin:0 auto; background:var(--bg,#e6f1e1); border-radius:22px; padding:10px 12px 8px 24px; display:flex; align-items:center; gap:16px; }
  .txt { flex:1; min-width:0; font-size:15.5px; line-height:1.25; }
  .txt b { font-weight:800; }
  form { display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; flex:0 1 440px; }
  input[type=email] { flex:1; min-width:0; height:42px; border:2px solid transparent; border-radius:999px; padding:0 16px; font:inherit; font-size:15px; background:#fff; color:var(--ink); }
  input[type=email]:focus { outline:none; border-color:var(--orange-d); }
  button { height:42px; padding:0 20px; border:0; border-radius:999px; background:var(--orange); color:var(--ink); font:inherit; font-weight:800; font-size:15px; cursor:pointer; white-space:nowrap; transition:background .2s; }
  button:hover { background:var(--orange-d); }
  .consent { flex:1 1 100%; padding-left:14px; font-size:11.5px; color:#4a3c34; display:flex; gap:5px; align-items:center; cursor:pointer; white-space:nowrap; }
  .consent input { width:15px; height:15px; margin:0; accent-color:var(--orange-d); }
  .trap { position:absolute; left:-5000px; }
  .msg { font-weight:700; font-size:15px; padding-right:16px; }
  .err { outline:2px solid #c0392b; outline-offset:1px; }
  .shake { animation:shake .3s; }
  @keyframes shake { 25% { transform:translateX(-3px); } 75% { transform:translateX(3px); } }

  @media (max-width:820px) {
    .bar { border-radius:18px; flex-wrap:wrap; padding:12px 14px; gap:8px; }
    .txt { flex:1 1 100%; font-size:14.5px; text-align:center; }
    form { flex:1 1 100%; flex-wrap:wrap; justify-content:center; }
    input[type=email] { flex:1 1 180px; height:40px; } button { height:40px; padding:0 16px; font-size:14px; }
    .consent { justify-content:center; padding-left:0; }
    .msg { flex:1 1 100%; text-align:center; padding:6px 0; }
  }
</style>
</head>
<body>
<div class="bar" id="bar">
  <div class="txt" id="txt">📬 <b>Stay in the loop on Chinese.</b> Tips, new resources and Club news in your inbox.</div>
  <form id="f" novalidate>
    <input type="email" id="email" placeholder="Your email" autocomplete="email" aria-label="Your email">
    <button type="submit">Subscribe</button>
    <label class="consent" id="cl"><input type="checkbox" id="ok">I agree to receive emails. Unsubscribe anytime.</label>
    <input class="trap" type="text" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">
  </form>
</div>
<script>
  var SHEET_URL = "https://script.google.com/macros/s/AKfycbwPWbx4dg8r7HWMa_uMV-2ZH6Xis7VnzEWvUgVc8G3AUzY4lnrtaooCZGgsDrwHZ9VMYg/exec"; // Start Here sheet
  var bg = new URLSearchParams(location.search).get("bg");
  if (bg && /^[0-9a-f]{6}$/i.test(bg)) document.documentElement.style.setProperty("--bg", "#" + bg);
  var page = (document.referrer || "").replace(/^https?:\/\/(www\.)?mandarinzest\.com/, "").slice(0, 120) || "unknown";

  function nope(el) { el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake", "err"); setTimeout(function () { el.classList.remove("err"); }, 1500); }
  document.getElementById("f").addEventListener("submit", function (e) {
    e.preventDefault();
    var em = document.getElementById("email"), email = em.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { nope(em); em.focus(); return; }
    if (!document.getElementById("ok").checked) { nope(document.getElementById("cl")); return; }
    if (!document.getElementById("website").value) {
      fetch(SHEET_URL, { method:"POST", mode:"no-cors", keepalive:true, headers:{ "Content-Type":"text/plain;charset=utf-8" },
        body: JSON.stringify({ email: email, source: "subscribe-bar | " + page, timestamp: new Date().toISOString() }) }).catch(function () {});
    }
    this.outerHTML = '<div class="msg" role="status">🎉 You\'re subscribed. 谢谢！</div>';
  });
</script>
</body>
</html>

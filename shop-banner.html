<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mandarin Zest shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Thin banner above the shop's products: "built by advanced learners, checked by professional native teachers"
     + the current discount code (copy button). Offers: OFFERS list at the bottom of the file; the banner picks
     the one running now (Taiwan time) and falls back to the regular offer. Embed height: see README. */
  :root { --ink:#2a2420; --orange:#f37a48; --orange-d:#e2632f; --green:#1b6f1b; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:transparent; }
  body { font-family:'Outfit',system-ui,sans-serif; color:var(--ink); -webkit-font-smoothing:antialiased; padding:2px; }
  .banner { height:100%; min-height:144px; max-width:1400px; margin:0 auto; display:flex; border-radius:22px; overflow:hidden; background:#e6f1e1; }
  .made { flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:22px; padding:0 28px; }
  .duo { flex:none; display:flex; }
  .duo span { width:46px; height:46px; border-radius:50%; display:grid; place-items:center; font-size:15px; font-weight:800; }
  .duo .s { background:#fff; color:var(--green); box-shadow:0 4px 10px rgba(27,111,27,.12); }
  .duo .t { background:#f8dacd; color:#a8431a; margin-left:-12px; box-shadow:0 4px 10px rgba(168,67,26,.12); }
  .txt { display:flex; flex-direction:column; gap:5px; min-width:0; }
  .eyebrow { font-size:12px; font-weight:800; letter-spacing:.09em; color:var(--green); }
  .txt h2 { margin:0; font-size:22px; font-weight:800; line-height:1.2; }
  .txt p { margin:0; font-size:14.5px; line-height:1.4; color:#3f4a3c; }

  .deal { flex:0 0 470px; display:flex; align-items:center; gap:14px; padding:0 22px 0 0; background:var(--ink); color:#fff; }
  .deal img { width:138px; height:138px; object-fit:contain; object-position:50% 100%; align-self:flex-end; margin-bottom:-4px; flex:none;
              animation:wave 3.6s ease-in-out infinite; transform-origin:50% 90%; }
  @keyframes wave { 0%,100% { transform:rotate(-3deg) translateY(0); } 50% { transform:rotate(3deg) translateY(-4px); } }
  .dtxt { display:flex; flex-direction:column; gap:8px; min-width:0; }
  .label { font-size:12px; font-weight:800; letter-spacing:.09em; color:#f8b48f; text-transform:uppercase; }
  .off { font-size:24px; font-weight:800; line-height:1.1; }
  .off b { color:var(--orange); font-weight:800; }
  .coderow { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .code { display:inline-flex; align-items:center; height:40px; padding:0 14px; border:2px dashed var(--orange); border-radius:10px; font-size:17px; font-weight:800; letter-spacing:.06em; user-select:all; }
  .copy { white-space:nowrap; height:40px; padding:0 16px; border:0; border-radius:999px; background:var(--orange); color:var(--ink); font:inherit; font-size:14.5px; font-weight:800; cursor:pointer; transition:background .2s, transform .2s; }
  .copy:hover { background:var(--orange-d); transform:translateY(-1px); }
  .copy:focus-visible { outline:3px solid #f8b48f; outline-offset:2px; }
  .copy.done { background:#9fd89f; }

  @media (max-width:1350px) { .txt p { display:none; } }
  @media (max-width:900px) {
    .made { gap:14px; padding:0 18px; } .duo { display:none; }
    .txt h2 { font-size:18px; }
    .deal { flex-basis:390px; gap:10px; padding-right:16px; }
    .deal img { width:112px; height:120px; }
    .off { font-size:20px; } .coderow { flex-wrap:nowrap; } .code { font-size:15px; height:36px; padding:0 11px; } .copy { height:36px; padding:0 13px; font-size:13.5px; }
  }
  /* phones: headline on top, the deal underneath */
  @media (max-width:640px) {
    .banner { flex-direction:column; border-radius:20px; min-height:0; }
    .made { flex:none; padding:14px 18px 12px; }
    .eyebrow { font-size:11px; } .txt h2 { font-size:17px; line-height:1.22; }
    .deal { flex:1 1 auto; padding:0 16px 0 4px; gap:8px; }
    .deal img { width:112px; height:112px; }
    .dtxt { gap:6px; } .label { font-size:11px; } .off { font-size:18px; line-height:1.15; }
    .coderow { flex-direction:column; align-items:flex-start; gap:6px; }
    .code { height:34px; font-size:15px; } .copy { height:44px; font-size:14px; padding:0 16px; }
  }
  @media (prefers-reduced-motion:reduce) { .deal img { animation:none; } }
</style>
</head>
<body>
<section class="banner" aria-label="How our materials are made, and the current discount code">
  <div class="made">
    <div class="duo" aria-hidden="true"><span class="s">学</span><span class="t">师</span></div>
    <div class="txt">
      <div class="eyebrow">HOW OUR MATERIALS ARE MADE</div>
      <h2>Built by advanced learners, checked by professional native teachers</h2>
      <p>We know where learners get stuck. Our teachers make sure every word sounds natural and correct.</p>
    </div>
  </div>
  <div class="deal">
    <img id="img" src="" alt="">
    <div class="dtxt">
      <div class="label" id="label"></div>
      <div class="off" id="off"></div>
      <div class="coderow">
        <span class="code" id="code"></span>
        <button type="button" class="copy" id="copy">Copy code</button>
      </div>
    </div>
  </div>
</section>
<script>
  // ═══ OFFERS: the first one whose dates include today (Taiwan time) is shown. ═══
  // from / until are dates in Taiwan time, both days included. The REGULAR offer is shown when no seasonal one is running.
  // For a new celebration: add a line at the top with its code, label, discount, dates and a picture in the shop/ folder.
  var OFFERS = [
    { label:"Halloween sale · ends 31 October", short:"Halloween · ends 31 Oct", off:"30% off", code:"HALLOWEEN26",
      img:"shop/mascot-halloween.png", alt:"Mandarin Zest mascot dressed as a witch with a black cat", from:"2026-10-01", until:"2026-10-31" }
  ];
  var REGULAR = { label:"Shop offer", short:"Shop offer", off:"10% off", code:"WELCOME01",
      img:"shop/mascot-reading.png", alt:"Mandarin Zest mascot reading a book" };

  // today's date in Taiwan (UTC+8), as YYYY-MM-DD; ?date=2026-11-02 previews another day
  var q = new URLSearchParams(location.search).get("date");
  var today = /^\d{4}-\d{2}-\d{2}$/.test(q || "") ? q : new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);
  var o = OFFERS.filter(function (x) { return x.from <= today && today <= x.until; })[0] || REGULAR;

  var phone = matchMedia("(max-width:900px)");
  function label() { document.getElementById("label").textContent = phone.matches ? o.short : o.label; }
  label(); phone.addEventListener ? phone.addEventListener("change", label) : phone.addListener(label);
  document.getElementById("off").innerHTML = "<b>" + o.off + "</b> the entire shop";
  document.getElementById("code").textContent = o.code;
  var img = document.getElementById("img"); img.src = o.img; img.alt = o.alt;

  document.getElementById("copy").addEventListener("click", function () {
    var btn = this;
    function ok() { btn.textContent = "Copied ✓"; btn.classList.add("done"); setTimeout(function () { btn.textContent = "Copy code"; btn.classList.remove("done"); }, 2200); }
    function fallback() {
      var t = document.createElement("textarea"); t.value = o.code; t.setAttribute("readonly", ""); t.style.position = "fixed"; t.style.opacity = "0";
      document.body.appendChild(t); t.select();
      try { document.execCommand("copy"); ok(); } catch (e) { var r = document.createRange(); r.selectNodeContents(document.getElementById("code")); getSelection().removeAllRanges(); getSelection().addRange(r); }
      t.remove();
    }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(o.code).then(ok, fallback); else fallback();
  });
</script>
</body>
</html>

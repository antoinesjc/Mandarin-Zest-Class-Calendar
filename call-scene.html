<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Mandarin Zest Club · live session scene</title>
<!-- Animated video-call scene: 4 people take turns talking (speech bubble, moving mouth, green "speaking" ring).
     Fits any frame: the call keeps its shape and scales to the frame's width and height. Transparent background.
     Embed on the Club page (example): <iframe src="https://antoinesjc.github.io/Mandarin-Zest-Class-Calendar/call-scene.html" title="A live Mandarin Zest Club session" scrolling="no" style="width:100%;height:400px;border:0;display:block"></iframe>
     To change what people say, edit the text in the four "bubble" spans below. -->
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700&family=Noto+Sans+SC:wght@700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; padding: 8px 12px 24px; font-family: 'Outfit', system-ui, sans-serif; }
  .call {
    container-type: inline-size;
    width: min(100%, calc((100vh - 32px) * 1.29)); aspect-ratio: 460 / 356;
    background: #2a2420; border-radius: 6.1cqw; padding: 3.5cqw;
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 2.2cqw;
    box-shadow: 0 14px 18px -8px rgba(42,36,32,.28);
  }
  .tile { position: relative; overflow: hidden; border-radius: 3.5cqw; outline: 0 solid #3fbf5f; outline-offset: -0.7cqw; transition: outline-width .2s; }
  .tile.talk { outline-width: 0.7cqw; }
  .tile svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .bubble {
    position: absolute; top: 2.6cqw; z-index: 2; background: #fff; color: #2a2420;
    font-family: 'Noto Sans SC', sans-serif; font-weight: 700; font-size: 3.9cqw; line-height: 1.3; white-space: nowrap;
    padding: 1.3cqw 2.6cqw; box-shadow: 0 2px 6px rgba(42,36,32,.12);
    opacity: 0; transform: scale(.6) translateY(1.5cqw); transition: opacity .25s, transform .35s cubic-bezier(.3,1.6,.5,1);
  }
  .bubble.left { left: 2.6cqw; border-radius: 3cqw 3cqw 3cqw .9cqw; transform-origin: 0 100%; }
  .bubble.right { right: 2.6cqw; border-radius: 3cqw 3cqw .9cqw 3cqw; transform-origin: 100% 100%; }
  .talk .bubble { opacity: 1; transform: none; }
  .label {
    position: absolute; left: 2.2cqw; bottom: 2.2cqw; z-index: 2; display: inline-flex; align-items: center; gap: 1.1cqw;
    font-size: 2.6cqw; font-weight: 700; color: #fff; background: rgba(42,36,32,.75); padding: .65cqw 1.7cqw; border-radius: 1.3cqw;
  }
  .mic { display: none; align-items: flex-end; gap: .35cqw; height: 2.2cqw; }
  .talk .mic { display: inline-flex; }
  .mic i { width: .55cqw; background: #6ee08a; border-radius: .3cqw; animation: bar .5s ease-in-out infinite alternate; }
  .mic i:nth-child(2) { animation-delay: .15s; } .mic i:nth-child(3) { animation-delay: .3s; }
  @keyframes bar { from { height: 30%; } to { height: 100%; } }

  .head, .person, .eyes, .mouth { transform-box: fill-box; }
  .person { transform-origin: 50% 100%; animation: breathe 4s ease-in-out infinite; }
  .tile:nth-child(2) .person { animation-delay: -1s; } .tile:nth-child(3) .person { animation-delay: -2.2s; } .tile:nth-child(4) .person { animation-delay: -3.1s; }
  @keyframes breathe { 50% { transform: translateY(-0.6px); } }
  .eyes { transform-origin: 50% 50%; animation: blink 5s infinite; }
  .tile:nth-child(2) .eyes { animation-delay: -1.7s; } .tile:nth-child(3) .eyes { animation-delay: -3.3s; } .tile:nth-child(4) .eyes { animation-delay: -.6s; }
  @keyframes blink { 0%, 95%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
  .head { transform-origin: 50% 90%; }
  .talk .head { animation: nod 1.1s ease-in-out infinite; }
  @keyframes nod { 0%, 100% { transform: rotate(0); } 30% { transform: rotate(-3deg) translateY(-0.5px); } 70% { transform: rotate(2deg); } }
  .mouth { opacity: 0; transform-origin: 50% 30%; }
  .talk .mouth { opacity: 1; animation: talk .32s ease-in-out infinite alternate; }
  .talk .smile { opacity: 0; }
  @keyframes talk { from { transform: scaleY(.25); } to { transform: scaleY(1); } }

  @media (prefers-reduced-motion: reduce) {
    .person, .eyes, .talk .head, .talk .mouth, .mic i { animation: none !important; }
    .bubble { opacity: 1; transform: none; transition: none; }
  }
</style>
</head>
<body>

    <div class="tile" style="background:#dbe7ee" data-i="2"><svg viewBox="0 0 120 90" preserveAspectRatio="xMidYMax meet" aria-hidden="true"><g transform="translate(30 0)"><g class="person"><path d="M42 40 C40 60 42 72 50 74 L70 74 C78 72 80 60 78 40 Z" fill="#1f1714"/><rect x="54" y="54" width="12" height="12" rx="4" fill="#7a4b30"/><path d="M27 92 C27 72 40 63 60 63 C80 63 93 72 93 92 Z" fill="#f37a48"/><path d="M52 63.5 L60 72 L68 63.5" fill="none" stroke="#fde3d6" stroke-width="2.2" stroke-linejoin="round"/><g class="head"><ellipse cx="60" cy="41" rx="15.5" ry="17.5" fill="#8d5a3b"/><g class="eyes"><ellipse cx="54" cy="42" rx="1.8" ry="1.9" fill="#2a2420"/><ellipse cx="66" cy="42" rx="1.8" ry="1.9" fill="#2a2420"/></g><circle cx="50.5" cy="47.5" r="2.6" fill="#d9736a" opacity=".45"/><circle cx="69.5" cy="47.5" r="2.6" fill="#d9736a" opacity=".45"/><path class="smile" d="M55.5 49 Q60 53 64.5 49" fill="none" stroke="#2a2420" stroke-width="1.6" stroke-linecap="round"/><ellipse class="mouth" cx="60" cy="50.6" rx="3.4" ry="2.6" fill="#7a2e22"/><path d="M44 44 C42 26 52 21 60 21 C70 21 78 27 76 44 C74 34 70 30 64 29 C60 33 52 35 44 44 Z" fill="#1f1714"/></g></g></g></svg><span class="bubble left">我觉得…</span><span class="label">Learner<span class="mic" aria-hidden="true"><i></i><i></i><i></i></span></span></div>

<script>
// Who speaks, in order: host, learner, learner, you. Each talks for ~2.4 s, with a short pause between.
(function () {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var tiles = document.querySelectorAll('.tile');
  var order = [0, 2, 1, 3], k = 0;
  function next() {
    tiles.forEach(function (t) { t.classList.remove('talk'); });
    var t = tiles[order[k % order.length]]; k++;
    setTimeout(function () { t.classList.add('talk'); }, 450);
  }
  next(); setInterval(next, 2900);
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chinese Zodiac workbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Compact blog banner: Workbook "Chinese Zodiac: the Story of the Great Race (HSK 3-4)".
     EDIT TEXT, PRICE (PRICE in the script) AND LINKS DIRECTLY IN THIS FILE.
     Code and % come from shop/offers.js, like the other shop banners. */
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }
  body { font-family: 'Outfit', system-ui, sans-serif; color: #2a2420; padding: 4px; }
  .banner { max-width: 760px; margin: 0 auto; border-radius: 18px; background: #fbe4d8; padding: 16px 20px;
            display: flex; gap: 18px; align-items: center; }
  .cover { flex: 0 0 96px; width: 96px; height: 96px; border-radius: 12px; overflow: hidden; display: block;
           box-shadow: 0 6px 14px rgba(90,40,20,.16); background: #fff; }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .text { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .1em; color: #8a3214; }
  h3 { margin: 0; font-size: 19px; font-weight: 800; line-height: 1.2; color: #3b1608; }
  p { margin: 0; font-size: 14px; line-height: 1.45; color: #55301f; }
  .deal { font-size: 13px; color: #55301f; margin-top: 2px; }
  .deal button { font: inherit; font-weight: 800; color: #3b1608; background: #fff; border: 1.5px dashed #c2410c;
                 border-radius: 7px; padding: 1px 7px; cursor: pointer; }
  .side { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .price { font-size: 13px; color: #55301f; white-space: nowrap; }
  .price s { color: #7a5a4c; }
  .price b { font-size: 20px; color: #3b1608; }
  .btn { text-decoration: none; font-weight: 800; font-size: 15px; padding: 10px 18px; border-radius: 999px;
         background: #f37a48; color: #2a2420; white-space: nowrap; }
  .btn:hover { background: #e2632f; }
  .btn:focus-visible, .deal button:focus-visible { outline: 3px solid #4f7a94; outline-offset: 2px; }
  @media (max-width: 600px) {
    .banner { flex-wrap: wrap; padding: 14px 16px; gap: 12px 14px; }
    .cover { flex-basis: 76px; width: 76px; height: 76px; }
    .text { flex-basis: calc(100% - 90px); }
    h3 { font-size: 17px; }
    p { display: none; }
    .side { flex: 1 1 100%; flex-direction: row; justify-content: space-between; }
  }
</style>
</head>
<body>
<div class="banner">
  <a class="cover" href="https://www.mandarinzest.com/shop/workbook-chinese-zodiac-the-story-of-the-great-race-hsk3-4-37" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true">
    <img alt="" src="https://www.mandarinzest.com/web/image/product.template/37/image_1024?unique=53c427a" onerror="this.src='../zodiac/rat.png'">
  </a>
  <div class="text">
    <div class="eyebrow">WORKBOOK · HSK 3–4</div>
    <h3>Read the Great Race legend in Chinese</h3>
    <p>The zodiac story in 9 chapters, with pinyin help, word lists, grammar and an answer key.</p>
    <div class="deal"><span id="pct">10%</span> off with <button id="code" type="button" aria-label="Copy the code WELCOME01">WELCOME01</button> <span id="copied"></span></div>
  </div>
  <div class="side">
    <div class="price"><s>US$8</s> <b>US$7.20</b></div>
    <a class="btn" href="https://www.mandarinzest.com/shop/workbook-chinese-zodiac-the-story-of-the-great-race-hsk3-4-37" target="_blank" rel="noopener">Get the workbook</a>
  </div>
</div>
<script src="../shop/offers.js"></script>
<script>
  var PRICE = 8; // US$, regular price of the workbook
  var o = window.OFFER || { off: "10% off", code: "WELCOME01" };
  var pct = +((o.off.match(/\d+/) || ["10"])[0]);
  var btn = document.getElementById("code"), copied = document.getElementById("copied");
  document.getElementById("pct").textContent = pct + "%";
  btn.textContent = o.code;
  btn.setAttribute("aria-label", "Copy the code " + o.code);
  document.querySelector(".price s").textContent = "US$" + PRICE;
  document.querySelector(".price b").textContent = "US$" + (PRICE * (100 - pct) / 100).toFixed(2).replace(/\.00$/, "");
  btn.addEventListener("click", function () {
    try { navigator.clipboard.writeText(o.code).then(function () { copied.textContent = "Copied ✓"; setTimeout(function () { copied.textContent = ""; }, 1800); }); } catch (e) {}
  });

  function reportHeight() {
    var h = Math.ceil(document.querySelector(".banner").getBoundingClientRect().bottom + 6);
    try { parent.postMessage({ mzBanner: "zodiac-workbook", height: h }, "*"); parent.postMessage({ mz: "height", h: h }, "*"); } catch (e) {}
  }
  window.addEventListener("load", reportHeight);
  window.addEventListener("resize", reportHeight);
  if (document.fonts) document.fonts.ready.then(reportHeight);
</script>
</body>
</html>
